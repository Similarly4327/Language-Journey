<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Language Journey — Japans</title>
<style>

:root{
  color-scheme:light dark;
  --bg:#f4f5f7;
  --card:#ffffff;
  --panel:#f0f2f5;
  --text:#17191c;
  --muted:#6d737c;
  --border:#d8dce2;
  --accent:#4b67d1;
  --accent-soft:#e9edff;
  --good:#2e7d5b;
  --copper:#a56b45;
  --silver:#8c949e;
  --gold:#b88b27;
  --platinum:#67b8ef;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111317;
    --card:#1a1d22;
    --panel:#23272e;
    --text:#f2f4f7;
    --muted:#a8afb9;
    --border:#343941;
    --accent:#8da2ff;
    --accent-soft:#252d50;
    --good:#67c49b
  }
}

*{box-sizing:border-box}
html{
  width:100%;
  min-width:0;
  min-height:100%;
  -webkit-text-size-adjust:100%;
  background:var(--bg);
}
body{
  width:100%;
  min-width:0;
  min-height:100%;
  margin:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
button,select,input{
  font:inherit;
  color:inherit;
  -webkit-tap-highlight-color:transparent;
}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

/* CRITICAL:
   Grid children are allowed to shrink. Without this the horizontal level
   rail makes the whole page wider than an iPhone viewport. */
.app,
.app > *,
.stack,
.stack > *,
main,
section{
  min-width:0;
}
.app{
  width:100%;
  max-width:1120px;
  min-height:100dvh;
  margin:0 auto;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(34px, calc(env(safe-area-inset-bottom) + 22px))
    max(12px, env(safe-area-inset-left));
}
.stack{
  display:grid;
  gap:10px;
  align-content:start; /* Prevent quiz cards from stretching to viewport height */
}
.dictionary-search{width:100%;min-height:48px;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:10px 12px}
.dictionary-results{display:grid;gap:7px;max-height:min(48vh,420px);overflow:auto}
.dictionary-result{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;padding:9px 11px;border:1px solid var(--border);border-radius:12px;background:var(--card);text-align:left}
.dictionary-result small{display:block;color:var(--muted);margin-top:2px}
.dictionary-kind{font-size:11px;color:var(--muted);white-space:nowrap}
.dictionary-entry-title{font-size:34px;font-weight:800;line-height:1.2}
.dictionary-link{border:0;background:none;color:var(--accent);font:inherit;font-weight:650;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px;padding:0 2px;cursor:pointer}
.dictionary-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:#0008}
.dictionary-modal.hidden{display:none}
.dictionary-modal-card{width:min(620px,100%);max-height:88dvh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 20px 60px #0004}
.dictionary-inline-context{border-left:3px solid var(--accent);padding:8px 10px;background:var(--panel);border-radius:0 10px 10px 0}
@media(max-width:520px){.dictionary-entry-title{font-size:30px}.dictionary-modal-card{padding:13px}}
.card{
  width:100%;
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
}
.panel{
  min-width:0;
  background:var(--panel);
  border-radius:13px;
  padding:12px;
}
.between{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  min-width:0;
}
.between>*{min-width:0}
.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}
.grid5{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.h1{font-size:22px;line-height:1.18;font-weight:750}
.h2{font-size:18px;line-height:1.25;font-weight:720}
.eyebrow{
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:11px;
  font-weight:750;
  color:var(--muted)
}

.btn{
  min-height:46px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:12px;
  padding:9px 12px;
  font-weight:650;
}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.btn.tiny{min-height:40px;font-size:13px}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{
  min-height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  font-size:13px;
  font-weight:700;
}
.tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.select{
  width:100%;
  min-width:0;
  min-height:44px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:0 11px
}

/* Level navigation */
.level-nav{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) 40px;
  align-items:stretch;
  gap:6px;
  width:100%;
  min-width:0;
  margin-top:9px;
}
.level-arrow{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:70px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:var(--muted);
  font-size:27px;
  line-height:1;
  touch-action:manipulation;
}
.level-scroll{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
  touch-action:pan-x;
}
.level-scroll::-webkit-scrollbar{display:none}
.levels{
  display:flex;
  flex-wrap:nowrap;
  gap:8px;
  width:max-content;
  min-width:100%;
  min-height:100%;
}
.level{
  flex:0 0 138px;
  width:138px;
  min-width:138px;
  min-height:82px;
  text-align:left;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:14px;
  padding:10px;
  scroll-snap-align:start;
  touch-action:manipulation;
}
.level.active{
  border:2px solid var(--accent);
  background:var(--accent-soft)
}
.level .num{font-size:11px;color:var(--muted);font-weight:750}
.level .name{font-weight:750;margin-top:3px;line-height:1.15}
.level .sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}

/* Learning content */
.kana-card{
  text-align:center;
  background:var(--panel);
  border-radius:12px;
  padding:11px 5px
}
.kana{font-size:44px;line-height:1.05}
.romaji{font-weight:700;margin-top:5px}
.rank{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  width:auto;
  min-width:max-content;
  max-width:100%;
  border:1px solid var(--border);
  border-radius:999px;
  padding:4px 12px;
  font-size:11px;
  line-height:1.1;
  font-weight:750;
  white-space:nowrap
}
.rank-Copper{border-color:var(--copper)}
.rank-Silver{border-color:var(--silver)}
.rank-Gold{border-color:var(--gold)}
.rank-Platinum{border-color:var(--platinum)}
.rank-new{border-color:var(--border)}
.progress{
  height:8px;
  background:var(--panel);
  border-radius:999px;
  overflow:hidden
}
.progress>div{
  height:100%;
  background:var(--accent);
  width:0
}
.hidden{display:none!important}

/* Quiz: deliberately compact. */
#quizView,
#resultView{
  width:100%;
  max-width:820px;
  margin-inline:auto;
  align-content:start;
}
.question{
  height:auto!important;
  min-height:0!important;
  text-align:left;
  align-self:start;
}
.question #qHint{
  min-height:22px;
  text-align:left
}
.prompt{
  display:block;
  width:100%;
  min-height:0!important;
  margin:0;
  padding:16px 4px 18px;
  text-align:center;
  font-size:68px;
  font-weight:700;
  line-height:1.05;
  overflow-wrap:anywhere;
  white-space:pre-line;
  color:var(--text)
}
.choices{
  display:grid!important;
  width:100%!important;
  min-width:0!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:8px;
  align-items:stretch;
}
.choices.choices-text{
  grid-template-columns:1fr!important
}
.choice{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%!important;
  min-width:0!important;
  min-height:70px;
  margin:0!important;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:13px;
  padding:8px 6px;
  font-weight:750;
  font-size:19px;
  line-height:1.18;
  text-align:center;
  overflow-wrap:anywhere;
  white-space:normal
}
.choices.choices-text .choice{
  justify-content:flex-start;
  min-height:52px;
  padding:10px 12px;
  text-align:left;
  font-size:16px
}
.choice.correct{outline:2px solid var(--good)}
.feedback{
  min-height:46px;
  margin-top:8px;
  border-radius:12px;
  padding:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:700
}
.error{
  background:var(--panel);
  border-radius:12px;
  padding:11px
}

.step-list{display:grid;gap:8px}
.step{border-left:3px solid var(--border);padding:4px 0 4px 11px}
.step-title{font-weight:720}
.vocab-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px
}
.vocab{
  min-width:0;
  background:var(--panel);
  border-radius:12px;
  padding:10px
}
.jp{font-size:23px;font-weight:720}
.small-section{margin-top:14px}
.small-section-title{margin-bottom:7px;font-size:13px;font-weight:760;color:var(--muted)}
.small-rule-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.small-rule-card,.small-example-card{min-width:0;background:var(--panel);border-radius:12px;padding:10px}
.small-rule-card .formula{margin-top:3px;font-size:11px;color:var(--muted)}
.small-example-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.small-example-card .meaning{margin-top:2px;font-size:12px;color:var(--muted)}
.small-objectives{display:grid;gap:5px;margin-top:7px}
.small-objective{display:flex;gap:7px;align-items:flex-start;font-size:13px}
.small-objective::before{content:"✓";color:var(--good);font-weight:800}
.lesson-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center
}
.notice{
  border-left:4px solid var(--accent);
  padding:10px 12px;
  background:var(--panel);
  border-radius:10px
}

/* Level 4 · echte leerroute */
.lang-lesson-list{display:grid;gap:9px}
.lang-lesson-card{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:15px;padding:13px}
.lang-lesson-card .pattern{margin-top:6px;color:var(--muted);font-size:12px}
.lang-stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:12px}
.lang-step-btn{min-width:0;min-height:48px;border:1px solid var(--border);border-radius:11px;background:var(--panel);padding:6px 3px;color:var(--muted);font-size:10px;font-weight:750}
.lang-step-btn.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--text)}
.lang-step-btn.done::before{content:'✓ ';color:var(--good)}
#langStepBody{margin-top:10px}
.model-sentence{font-size:clamp(25px,7vw,38px);font-weight:800;text-align:center;line-height:1.35;margin:10px 0}
.sentence-analysis{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:10px}
.sentence-part{min-width:68px;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px}
.sentence-part .token{font-size:21px;font-weight:800}
.sentence-part .role{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-top:3px}
.sentence-part .gloss{font-size:11px;color:var(--muted);margin-top:2px}
.builder-answer{display:flex;flex-wrap:wrap;gap:7px;min-height:62px;align-items:center;padding:9px;border:2px dashed var(--border);border-radius:13px;background:var(--panel);margin-top:10px}
.builder-placeholder{color:var(--muted);font-size:13px}
.builder-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sentence-chip{min-height:46px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:8px 14px;font-size:19px;font-weight:750}
.sentence-chip.placed{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:var(--accent)}
.builder-feedback{min-height:38px;margin-top:8px;font-weight:700}
.word-romaji{color:var(--accent);font-size:12px;font-weight:750;margin-top:2px}
.route-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}

/* Storage UI */
.storage-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:26px;
  padding:3px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}
.storage-badge::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--good)
}
.storage-badge.off::before{background:#b65b5b}
.header-actions{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:5px;
  flex-direction:column
}

/* Phone */
@media(max-width:640px){
  .app{
    max-width:none;
    padding:
      max(10px, env(safe-area-inset-top))
      max(9px, env(safe-area-inset-right))
      max(30px, calc(env(safe-area-inset-bottom) + 18px))
      max(9px, env(safe-area-inset-left));
  }
  .stack{gap:9px}
  .card{border-radius:16px;padding:12px}
  .panel{border-radius:12px;padding:10px}
  .h1{font-size:20px}
  .h2{font-size:17px}
  .eyebrow{font-size:10px}

  /* Header no longer pushes the progress button off-screen. */
  .app>section:first-child>.between{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:end!important;
    gap:8px
  }
  .header-actions .storage-badge{display:none}
  .btn{min-height:48px;padding:9px 10px}
  .btn.tiny{min-height:44px}
  .tab{min-height:46px;font-size:12.5px;padding:5px 3px}
  .select{min-height:48px;font-size:16px}

  .level-nav{
    grid-template-columns:34px minmax(0,1fr) 34px;
    gap:5px
  }
  .level-arrow{
    min-height:74px;
    border-radius:12px;
    font-size:24px
  }
  .levels{gap:7px}
  .level{
    flex-basis:118px;
    width:118px;
    min-width:118px;
    min-height:74px;
    border-radius:13px;
    padding:8px
  }
  .level .num{font-size:10px}
  .level .name{font-size:14px}
  .level .sub{font-size:10.5px}

  .grid5{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .grid3{gap:7px}
  .grid2{gap:8px}
  .kana-card{padding:9px 4px}
  .kana{font-size:42px}
  .romaji{font-size:14px}

  .vocab-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .vocab{padding:9px}
  .jp{font-size:21px}
  .small-rule-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .small-example-grid{grid-template-columns:1fr;gap:7px}
  .lang-stepper{grid-template-columns:repeat(5,minmax(54px,1fr));overflow-x:auto;padding-bottom:3px}
  .sentence-chip{font-size:18px;padding:8px 13px}
  .route-actions{grid-template-columns:1fr}

  #quizView,#resultView{max-width:100%}
  .prompt{
    font-size:clamp(50px,15vw,62px);
    padding:13px 2px 15px
  }
  .choices{
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    gap:7px
  }
  .choice{
    min-height:62px;
    padding:7px 4px;
    font-size:18px
  }
  .choices.choices-text{grid-template-columns:1fr!important}
  .choices.choices-text .choice{
    min-height:50px;
    padding:9px 11px;
    font-size:16px
  }
  .feedback{min-height:42px}
  .progress{height:7px}
  .rank{
    flex:0 0 auto;
    min-width:max-content;
    font-size:10px;
    padding:4px 10px;
    line-height:1.1
  }
}

/* Narrow phones */
@media(max-width:380px){
  .level{
    flex-basis:112px;
    width:112px;
    min-width:112px
  }
  .level-nav{
    grid-template-columns:32px minmax(0,1fr) 32px
  }
  .choices{gap:6px}
  .choice{font-size:17px}
  .grid2{grid-template-columns:1fr}
  .vocab-grid{grid-template-columns:1fr}
}

/* Tablet */
@media(min-width:641px) and (max-width:999px){
  .app{max-width:840px;padding:16px 18px 42px}
  .level-nav{grid-template-columns:42px minmax(0,1fr) 42px}
  .level{flex-basis:150px;width:150px;min-width:150px}
  .prompt{font-size:72px}
}

/* Desktop */
@media(min-width:1000px){
  .app{max-width:1120px;padding:22px 26px 52px}
  .stack{gap:14px}
  .card{padding:18px}
  .h1{font-size:24px}
  .h2{font-size:19px}
  .level-nav{grid-template-columns:44px minmax(0,1fr) 44px}
  .level-arrow{min-height:84px}
  .level{flex-basis:165px;width:165px;min-width:165px}
  .prompt{font-size:82px;padding:24px 6px}
  .choice{min-height:76px;font-size:20px}
  .vocab-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* === v7 menu structure === */
.app-header{position:relative;z-index:5}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.header-copy{min-width:0}
.nav-back{
  flex:0 0 44px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);
  font-size:24px;line-height:1;font-weight:700
}
.level-menu-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
.level-menu-card{
  min-width:0;min-height:132px;text-align:left;border:2px solid var(--border);background:var(--card);
  border-radius:17px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;gap:10px
}
.level-menu-card .level-no{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.level-menu-card .level-title{font-size:18px;line-height:1.12;font-weight:800}
.level-menu-card .level-desc{font-size:12px;color:var(--muted);line-height:1.3}
.level-menu-card.rank-Copper{border-color:var(--copper)}
.level-menu-card.rank-Silver{border-color:var(--silver)}
.level-menu-card.rank-Gold{border-color:var(--gold)}
.level-menu-card.rank-Platinum{
  border-color:var(--platinum);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--platinum) 28%,transparent);
  background:color-mix(in srgb,var(--platinum) 8%,var(--card))
}
.level-rank-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.level-overview-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.module-list{display:grid;gap:9px}
.module-card{
  width:100%;min-width:0;text-align:left;border:1px solid var(--border);background:var(--card);
  border-radius:14px;padding:12px
}
.module-card.rank-Copper{border-color:var(--copper)}
.module-card.rank-Silver{border-color:var(--silver)}
.module-card.rank-Gold{border-color:var(--gold)}
.module-card.rank-Platinum{border-color:var(--platinum);background:color-mix(in srgb,var(--platinum) 6%,var(--card))}
.module-title{font-weight:800;font-size:17px}
.module-desc{font-size:12px;color:var(--muted);margin-top:3px}
.module-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}
.selection-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px
}
.select-tile{
  position:relative;display:flex;align-items:center;gap:9px;min-height:48px;padding:9px 10px;
  border:1px solid var(--border);border-radius:12px;background:var(--panel);font-weight:700
}
.select-tile input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
.select-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}
.character-select-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
  margin-top:10px
}
.char-select-tile{
  position:relative;
  display:flex;
  min-width:0;
  min-height:66px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:2px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  padding:6px 3px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none
}
.char-select-tile input{
  position:absolute;
  opacity:0;
  pointer-events:none
}
.char-select-tile .char-symbol{
  font-size:29px;
  line-height:1;
  font-weight:650
}
.char-select-tile .char-romaji{
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  line-height:1.1
}
.char-select-tile.selected{
  border:2px solid var(--accent);
  background:var(--accent-soft)
}
.selection-summary{
  margin-top:9px;
  padding:8px 10px;
  border-radius:10px;
  background:var(--panel);
  color:var(--muted);
  font-size:12px
}
.error-bank-card{border-left:4px solid #c56f63}
.error-count{font-variant-numeric:tabular-nums}
.overview-note{display:grid;gap:6px;margin-top:10px}
.overview-note>div{padding:8px 10px;background:var(--panel);border-radius:10px}
.lesson-select-grid{display:grid;grid-template-columns:1fr;gap:8px}
.lesson-select-card{
  border:1px solid var(--border);border-radius:13px;background:var(--card);padding:11px;text-align:left
}
.lesson-select-card.rank-Copper{border-color:var(--copper)}
.lesson-select-card.rank-Silver{border-color:var(--silver)}
.lesson-select-card.rank-Gold{border-color:var(--gold)}
.lesson-select-card.rank-Platinum{border-color:var(--platinum);background:color-mix(in srgb,var(--platinum) 6%,var(--card))}
@media(max-width:640px){
  .header-copy .h1{font-size:19px}
  .character-select-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .char-select-tile{min-height:62px;padding:5px 2px}
  .char-select-tile .char-symbol{font-size:27px}
  .nav-back{flex-basis:42px;width:42px;height:42px}
  .level-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .level-menu-card{min-height:122px;padding:11px;border-radius:15px}
  .level-menu-card .level-title{font-size:16px}
  .level-overview-actions,.module-actions{grid-template-columns:1fr}
  .selection-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .select-tile{min-height:46px;padding:8px}
}
@media(min-width:700px){
  .level-menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .selection-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lesson-select-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:1000px){
  .level-menu-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .character-select-grid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .selection-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lesson-select-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* === v11 expanded progress & individual mastery === */
.progress-tabs{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
.progress-tab{
  min-height:44px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:12px;
  font-size:12px;
  font-weight:750;
  padding:7px 5px;
}
.progress-tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.progress-stat-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.progress-stat{
  min-width:0;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:10px;
}
.progress-stat .value{
  font-size:23px;
  font-weight:800;
  line-height:1.1;
}
.progress-stat .label{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
}
.mastery-summary{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
}
.mastery-summary .rankbox{
  min-width:0;
  padding:8px 3px;
  border:1px solid var(--border);
  border-radius:11px;
  text-align:center;
  background:var(--panel);
}
.mastery-summary .rankbox strong{
  display:block;
  font-size:17px;
}
.mastery-summary .rankbox span{
  font-size:9.5px;
  color:var(--muted);
}
.mastery-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:6px;
}
.mastery-tile{
  min-width:0;
  min-height:68px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  padding:6px 2px;
  text-align:center;
}
.mastery-tile .symbol{
  font-size:28px;
  line-height:1.05;
  font-weight:650;
}
.mastery-tile .sound{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}
.mastery-tile .mini-rank{
  font-size:8.5px;
  font-weight:750;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.mastery-tile.review{
  box-shadow:inset 0 0 0 2px #d89242;
}
.mastery-detail-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.mastery-detail-grid .panel{
  text-align:left;
}
.mastery-score{
  font-size:34px;
  line-height:1;
  font-weight:850;
}
.mastery-actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.vocab-progress-list{
  display:grid;
  gap:8px;
}
.vocab-progress-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  padding:10px;
  text-align:left;
}
.vocab-progress-row .word{
  font-size:21px;
  font-weight:750;
}
.skill-row{
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
  background:var(--card);
}
.skill-row.unlocked{
  border-color:var(--good);
  background:color-mix(in srgb,var(--good) 5%,var(--card));
}
.skill-row .state{
  font-size:11px;
  font-weight:750;
  color:var(--muted);
}
.milestones{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.milestone{
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  color:var(--muted);
}
.milestone.reached{
  border-color:var(--gold);
  color:var(--text);
  background:color-mix(in srgb,var(--gold) 7%,var(--card));
}
.progress-note{
  border-left:4px solid var(--accent);
  background:var(--panel);
  border-radius:10px;
  padding:9px 11px;
  font-size:12px;
  color:var(--muted);
}
@media(max-width:640px){
  .progress-tabs{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .mastery-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
  .mastery-summary{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .mastery-summary .rankbox:nth-child(4),
  .mastery-summary .rankbox:nth-child(5){
    grid-column:auto;
  }
  .mastery-actions{
    grid-template-columns:1fr;
  }
}
@media(max-width:380px){
  .mastery-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}
@media(min-width:900px){
  .progress-stat-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .mastery-grid{
    grid-template-columns:repeat(10,minmax(0,1fr));
  }
}

/* === v12 immersive anime scenes + liquid glass === */
:root{
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.86);
  --glass-soft:rgba(247,250,252,.58);
  --glass-border:rgba(255,255,255,.72);
  --glass-shadow:0 18px 48px rgba(31,45,48,.16),0 2px 8px rgba(31,45,48,.08);
  --level-glass:rgba(255,255,255,.24);
  --level-glass-strong:rgba(255,255,255,.34);
  --continue-glass:rgba(255,250,243,.74);
}
@media(prefers-color-scheme:dark){
  :root{
    --glass:rgba(19,27,30,.72);
    --glass-strong:rgba(17,24,27,.88);
    --glass-soft:rgba(32,43,47,.62);
    --glass-border:rgba(255,255,255,.17);
    --glass-shadow:0 20px 58px rgba(0,0,0,.38),0 2px 10px rgba(0,0,0,.2);
    --level-glass:rgba(16,24,27,.26);
    --level-glass-strong:rgba(17,25,28,.36);
    --continue-glass:rgba(24,28,27,.78);
  }
}
body{
  position:relative;
  isolation:isolate;
  background:#d9e0da;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:-3vmax;
  pointer-events:none;
}
body::before{
  z-index:-2;
  background-image:url("assets/japan-journey-home.webp");
  background-size:cover;
  background-position:center center;
  filter:saturate(.88) contrast(.94) brightness(.96);
  transform:scale(1.025);
  transition:opacity .45s ease,filter .45s ease;
}
body[data-scene="classroom"]::before{
  background-image:url("assets/anime-classroom.webp");
  background-position:center center;
  filter:saturate(.82) contrast(.9) brightness(.9);
}
body::after{
  z-index:-1;
  background:
    linear-gradient(180deg,rgba(248,251,249,.42),rgba(236,241,237,.28) 48%,rgba(218,227,219,.5)),
    radial-gradient(circle at 50% 12%,rgba(255,255,255,.34),transparent 45%);
}
body[data-scene="classroom"]::after{
  background:linear-gradient(180deg,rgba(244,237,224,.22),rgba(32,42,45,.26));
}
@media(prefers-color-scheme:dark){
  body::after{
    background:linear-gradient(180deg,rgba(7,15,18,.42),rgba(8,15,18,.68));
  }
  body[data-scene="classroom"]::after{
    background:linear-gradient(180deg,rgba(12,16,18,.45),rgba(5,9,11,.72));
  }
}
.app{position:relative;z-index:1}
.app-header{
  position:sticky;
  top:max(8px,env(safe-area-inset-top));
  z-index:20;
  padding:10px 12px;
  border:1px solid var(--glass-border);
  border-radius:18px;
  background:var(--glass-strong);
  box-shadow:0 10px 30px rgba(32,48,52,.12);
  -webkit-backdrop-filter:blur(22px) saturate(1.28);
  backdrop-filter:blur(22px) saturate(1.28);
}
.app-header .storage-badge{display:none}
.header-actions{
  align-items:center;
  flex-direction:row;
}
.app-nav{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px;
  border:1px solid color-mix(in srgb,var(--glass-border) 78%,transparent);
  border-radius:13px;
  background:color-mix(in srgb,var(--glass-soft) 74%,transparent);
}
.app-nav-item{
  min-height:36px;
  border:0;
  border-radius:9px;
  padding:6px 12px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:760;
}
.app-nav-item.active{
  background:var(--glass-strong);
  color:var(--text);
  box-shadow:0 3px 12px rgba(32,48,52,.1);
}
.flashcard-intro{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.flashcard-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}
.flashcard-stat{padding:9px;background:var(--panel);border-radius:11px;text-align:center}
.flashcard-stat strong{display:block;font-size:18px}
.flashcard-stat span{font-size:11px;color:var(--muted)}
.flashcard-scope{display:grid;gap:8px}
.flashcard-level{border:1px solid var(--border);border-radius:12px;padding:10px}
.flashcard-level-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flashcard-lesson-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;margin-top:8px}
.flashcard-check{display:flex;align-items:flex-start;gap:7px;font-size:13px;min-width:0}
.flashcard-check input{width:18px;height:18px;flex:0 0 auto;margin:0}
.flashcard-front{min-height:110px;display:grid;place-items:center;text-align:center;padding:8px 8px 14px}
.flashcard-face-main{font-size:clamp(28px,8vw,46px);font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.flashcard-face-sub{font-size:14px;color:var(--muted);margin-top:8px}
.flashcard-answer-options{display:grid;gap:7px;margin-top:12px}
.flashcard-answer-options.is-hidden{position:relative}
.flashcard-answer-options.is-hidden .flashcard-answer-choice{filter:blur(7px);user-select:none;pointer-events:none}
.flashcard-options-reveal{position:absolute;inset:0;z-index:1;width:100%;min-height:100%;border:1px solid color-mix(in srgb,var(--border) 75%,transparent);border-radius:13px;background:color-mix(in srgb,var(--panel) 76%,transparent);backdrop-filter:blur(2px);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.flashcard-options-reveal:hover{color:var(--text);background:color-mix(in srgb,var(--panel) 86%,transparent)}
.flashcard-answer-choice{width:100%;min-height:44px;text-align:left;white-space:normal}
.flashcard-avatar{margin:0 0 2px}
.flashcard-avatar .avatar-assist{padding:2px 8px;min-height:48px}
.flashcard-avatar .avatar-assist-copy strong{font-size:12px}
.flashcard-avatar .avatar-assist-figure{width:42px;height:48px;flex-basis:42px}
.flashcard-avatar .avatar-assist-figure .avatar-figure,.flashcard-avatar .avatar-assist-figure .avatar-sprite{width:42px;height:52px}
.flashcard-answer-choice.is-correct{border-color:var(--good,#39865c);background:color-mix(in srgb,var(--good,#39865c) 14%,var(--panel));box-shadow:inset 0 0 0 1px var(--good,#39865c)}
.flashcard-answer-choice.is-incorrect{border-color:var(--danger,#b84b4b);background:color-mix(in srgb,var(--danger,#b84b4b) 10%,var(--panel))}
.flashcard-feedback-status{min-height:20px;margin-top:8px;text-align:center;font-weight:700}
.flashcard-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.flashcard-next-due{padding:10px;background:var(--panel);border-radius:11px}
.card,
.level-menu-card,
.module-card,
.lesson-select-card,
.skill-row,
.vocab-progress-row{
  border-color:var(--glass-border);
  background:var(--glass);
  box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  backdrop-filter:blur(24px) saturate(1.3);
}
.panel,
.overview-note>div,
.kana-card,
.vocab,
.choice,
.selection-summary,
.progress-stat,
.mastery-summary .rankbox,
.progress-note,
.notice,
.error{
  background:var(--glass-soft);
  border:1px solid color-mix(in srgb,var(--glass-border) 70%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  backdrop-filter:blur(16px) saturate(1.2);
}
.btn,
.tab,
.select,
.nav-back,
.level-arrow,
.select-tile,
.char-select-tile,
.progress-tab{
  border-color:var(--glass-border);
  background:var(--glass-strong);
  box-shadow:0 5px 16px rgba(34,48,51,.08);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  backdrop-filter:blur(18px) saturate(1.25);
}
.btn.primary,.tab.active,.progress-tab.active{
  background:linear-gradient(135deg,#d65356,#bf363d);
  border-color:rgba(255,255,255,.46);
  box-shadow:0 9px 22px rgba(144,37,43,.24);
}
.level-menu-grid{perspective:900px}
.level-menu-card{
  position:relative;
  overflow:hidden;
  min-height:146px;
  justify-content:flex-start;
  background:var(--level-glass);
  border:2px solid color-mix(in srgb,var(--glass-border) 72%,transparent);
  box-shadow:0 12px 34px rgba(31,45,48,.13);
  -webkit-backdrop-filter:blur(10px) saturate(1.12);
  backdrop-filter:blur(10px) saturate(1.12);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.level-menu-card::before{
  display:none;
}
.level-menu-card.rank-Copper,
.level-menu-card.rank-Silver,
.level-menu-card.rank-Gold,
.level-menu-card.rank-Platinum{
  background:var(--level-glass);
  box-shadow:0 12px 34px rgba(31,45,48,.13);
}
.level-menu-card.rank-Copper{border-color:#a96c46}
.level-menu-card.rank-Silver{border-color:#aeb7c0}
.level-menu-card.rank-Gold{border-color:#c59b3b}
.level-menu-card.rank-Platinum{border-color:#8dc9dc}
.level-menu-card::after{content:none}
.level-menu-card.rank-Platinum::after{
  content:"";
  position:absolute;
  top:-2px;
  right:13px;
  width:54px;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.92),transparent);
  rotate:-8deg;
  transform-origin:right center;
  pointer-events:none;
}
.level-menu-card:active{transform:scale(.985)}
@media(hover:hover){
  .level-menu-card:hover,.module-card:hover,.lesson-select-card:hover{
    transform:translateY(-2px);
    box-shadow:0 22px 52px rgba(31,45,48,.22);
  }
}
.journey-hero{
  position:relative;
  overflow:hidden;
  min-height:174px;
  padding:20px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 118px;
  gap:14px;
  align-items:center;
  background:linear-gradient(135deg,var(--continue-glass),color-mix(in srgb,var(--continue-glass) 80%,rgba(196,74,62,.2)));
  box-shadow:0 22px 58px rgba(48,44,38,.2),0 3px 10px rgba(48,44,38,.1);
  -webkit-backdrop-filter:blur(22px) saturate(1.24);
  backdrop-filter:blur(22px) saturate(1.24);
}
.journey-hero-copy{position:relative;z-index:1;min-width:0}
.journey-avatar{position:relative;z-index:1;justify-self:end;width:112px;display:grid;justify-items:center;align-self:center;gap:3px}
.avatar-sprite{
  width:90px;height:150px;
  background-image:url("assets/avatar-skins.png?v=3");
  background-repeat:no-repeat;
  /* De bron bevat een transparante veiligheidsstrook tussen beide rijen.
     222.222% toont exact het 360px-karaktervlak en bewaart de verhoudingen. */
  background-size:1000% 222.2222%;
  background-position:var(--avatar-x,0%) var(--avatar-y,0%);
  filter:drop-shadow(0 8px 13px rgba(49,39,34,.16));
}
.journey-avatar-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:12px;font-weight:850;text-align:center}
.journey-avatar-level{
  padding:3px 9px;border:1px solid color-mix(in srgb,var(--border) 78%,transparent);
  border-radius:999px;background:color-mix(in srgb,var(--card) 85%,transparent);
  color:var(--muted);font-size:11px;font-weight:800
}
.journey-hero .hero-mark{
  position:absolute;
  right:18px;
  top:50%;

function level4Knowledge(index){

function level4Sentence(tokens,meaning,pattern,patternLesson){

function level4SentencePool(index){
  const known=new Set(level4Knowledge(index).vocabulary.map(v=>v.jp));
  const out=[];
  const add=(tokens,meaning,pattern,at)=>{
    if(tokens.every(t=>known.has(t)||['は','です','の','か','も','を','に'].includes(t)))out.push(level4Sentence(tokens,meaning,pattern,at));
  };

    [['ひと','Ik ben een persoon.'],['ともだち','Ik ben een vriend.']].forEach(([n,m])=>add(['わたし','は',n,'です'],m,'topic-description',2));
  }

    const owners=[['わたし','mijn'],['ともだち','van een vriend']].filter(([jp])=>known.has(jp));
    const owned=[['ほん','boek','het boek'],['ねこ','kat','de kat'],['いぬ','hond','de hond']].filter(([jp])=>known.has(jp));
    demos.forEach(([d,dm])=>owners.forEach(([o,om])=>owned.forEach(([n,nm,defined])=>{
      const possession=om==='mijn'?`mijn ${nm}`:`${defined} ${om}`;
      add([d,'は',o,'の',n,'です'],`${dm[0].toUpperCase()+dm.slice(1)} is ${possession}.`,'possession',3);
    })));
  }

    out.filter(s=>['copula','topic-description','possession'].includes(s.pattern)).forEach(s=>{
      const statement=s.meaning.replace(/\.$/,'');
      const question=statement.startsWith('Ik ben ')?`Ben ik ${statement.slice(7).toLowerCase()}?`:`Is ${statement[0].toLowerCase()+statement.slice(1).replace(/ is /,' ')}?`;
      out.push(level4Sentence([...s.tokens,'か'],question,'question',4));
    });
  }
  if(index>=5)demos.forEach(([d,dm])=>things.forEach(([n,nm])=>add([d,'も',n,'です'],`${dm[0].toUpperCase()+dm.slice(1)} is ook ${nm}.`,'also',5)));

    const actions=[
      ['みず','のみます','Ik drink water.'],
      ['パン','たべます','Ik eet brood.'],
      ['さかな','たべます','Ik eet vis.'],
      ['さかな','みます','Ik kijk naar de vis.'],
      ['ねこ','みます','Ik kijk naar de kat.'],
      ['いぬ','みます','Ik kijk naar de hond.'],

function level4Choices(correct,candidates,count=3){
  return shuffle([correct,...shuffle([...new Set(candidates)].filter(x=>x!==correct)).slice(0,count-1)]);
}

function level4Question(kind,prompt,correct,choices,category,introducedAt,accepted=null,instruction=''){
  return lessonQuestion({kind,prompt,correct,choices,category,introducedAt,accepted,instruction});
}

function level4StructureQuestion(sentence,token,pos,knowledge){
  const shown=sentence.tokens.map((part,i)=>i===pos?'___':part).join(' ');
  const statement=sentence.tokens.filter(part=>part!=='か').join(' ');
  const noun=sentence.tokens[pos+1]||sentence.tokens[pos-1]||'';
  const settings={
    'は':{instruction:'Kies het partikel dat het topic markeert.',prompt:`Bedoelde betekenis: ${sentence.meaning}\n${shown}`},
    'です':{instruction:'Kies het beleefde slot van deze naamwoordzin.',prompt:`Bedoelde betekenis: ${sentence.meaning}\n${shown}`},
    'の':{instruction:'Kies の om “van” of bezit uit te drukken.',prompt:`Bedoelde betekenis: ${sentence.meaning}\n${shown}`},
    'か':{instruction:'Maak van de mededeling een ja/nee-vraag met か.',prompt:`Mededeling: ${statement}\nVraag: ${shown}`},
    'も':{instruction:'Kies も om in de tweede zin “ook” aan te geven.',prompt:`Eerder: これは ${noun} です\nNu: ${sentence.meaning}\n${shown}`},
    'を':{instruction:'Kies het partikel dat het object van de handeling markeert.',prompt:`Bedoelde betekenis: ${sentence.meaning}\n${shown}`},
    'に':{instruction:'Kies het partikel dat de bestemming “naar” markeert.',prompt:`Bedoelde betekenis: ${sentence.meaning}\n${shown}`}
  };
  const setting=settings[token];
  if(!setting)return null;
  const choices=level4Choices(token,knowledge.grammar,3);
  if(choices.length<2)return null;
  const grammarLesson=Math.max(0,level4LessonMetadata.findIndex(meta=>meta.introducedGrammar.includes(token)));
  return level4Question('fill',setting.prompt,token,choices,'structure',Math.max(sentence.introducedAt,grammarLesson),null,setting.instruction);
}

function level4QuestionBank(index){
  const knowledge=level4Knowledge(index),sentences=level4SentencePool(index),questions=[];
  knowledge.vocabulary.forEach(word=>{
    const meanings=knowledge.vocabulary.map(v=>v.meaning),forms=knowledge.vocabulary.map(v=>v.jp);
    questions.push(level4Question('mc',word.jp,word.meaning,level4Choices(word.meaning,meanings),'vocab',level4WordInfo[word.jp].lessonIndex,null,'Kies de Nederlandse betekenis van dit woord.'));
    questions.push(level4Question('mc',word.meaning,word.jp,level4Choices(word.jp,forms),'vocab',level4WordInfo[word.jp].lessonIndex,null,`Kies het Japanse woord voor “${word.meaning}”.`));
  });
  sentences.forEach(sentence=>{
    const samePattern=sentences.filter(s=>s.pattern===sentence.pattern);
    const at=sentence.reviewAt??sentence.introducedAt,answer=sentence.tokens.join(' ');
    questions.push(level4Question('meaning',answer,sentence.meaning,level4Choices(sentence.meaning,samePattern.map(s=>s.meaning)),'meaning',at,null,'Kies de Nederlandse betekenis van deze Japanse zin.'));
    questions.push(level4Question('order',sentence.meaning,answer,level4Choices(answer,samePattern.map(s=>s.tokens.join(' '))),'integration',at,null,'Kies de Japanse zin die precies de getoonde betekenis heeft.'));
    questions.push(level4Question('build',sentence.meaning,answer,shuffle(sentence.tokens),'build',at,null,'Bouw met de blokken de getoonde Nederlandse zin.'));
    const grammarPositions=sentence.tokens.map((token,pos)=>({token,pos})).filter(x=>knowledge.grammar.includes(x.token));
    grammarPositions.forEach(({token,pos})=>{
      const question=level4StructureQuestion(sentence,token,pos,knowledge);
      if(question)questions.push(question);
    });
  });
  const free=level4FreeBuilder(index,sentences);
  if(free)questions.push(level4Question('build',free[0],free[1][0],free[2],'build',index,free[1],'Bouw één geldige zin met de bekende blokken. Niet alle blokken hoeven op.'));
  return questions;
}

function level4FreeBuilder(index,sentences=level4SentencePool(index)){
  let preferred=index>=8?'destination':index>=6?'object-action':index>=5?'also':index>=4?'question':index>=3?'possession':index>=2?'topic-description':'copula';
  if(index===9){
    const available=[...new Set(sentences.map(s=>s.pattern))].filter(pattern=>sentences.filter(s=>s.pattern===pattern).length>1);
    preferred=shuffle(available)[0]||'copula';
  }
  let valid=sentences.filter(s=>s.pattern===preferred);
  if(valid.length<2)valid=sentences;
  if(!valid.length)return null;
  const accepted=valid.map(s=>s.tokens.join(' '));
  const blocks=shuffle([...new Set(valid.flatMap(s=>s.tokens))]);
  return['Bouw zelf één geldige zin met bekende blokken. Niet alle blokken hoeven op.',accepted,blocks];
}

function level4Weight(question,index){
  const age=index-(question.introducedAt??0);
  return age<=0?5:age<=2?3:1;
}

function weightedLevel4Pick(pool,count,index){
  const remaining=[...pool],picked=[];
  while(remaining.length&&picked.length<count){
    const total=remaining.reduce((sum,q)=>sum+level4Weight(q,index),0);
    let roll=Math.random()*total,chosen=0;
    for(let i=0;i<remaining.length;i++){roll-=level4Weight(remaining[i],index);if(roll<=0){chosen=i;break}}
    picked.push(remaining.splice(chosen,1)[0]);
  }
  return picked;
}

function balancedLevel4Questions(index,count,categories=null){
  let bank=level4QuestionBank(index);
  if(categories)bank=bank.filter(q=>categories.includes(q.category));
  const current=bank.filter(q=>(q.introducedAt??0)===index),review=bank.filter(q=>(q.introducedAt??0)<index);
  const currentCount=index===0?count:Math.ceil(count*.7),chosen=[];
  const takeBalanced=(pool,wanted)=>{
    const result=[],groups=[...new Set(pool.map(q=>q.category))];
    while(result.length<wanted&&pool.length){
      const category=groups[result.length%groups.length];
      const candidates=pool.filter(q=>q.category===category&&!result.includes(q));
      const fallback=pool.filter(q=>!result.includes(q));
      const next=weightedLevel4Pick(candidates.length?candidates:fallback,1,index)[0];
      if(!next)break;
      result.push(next);
    }
    return result;
  };
  chosen.push(...takeBalanced(current,currentCount));
  chosen.push(...takeBalanced(review,count-chosen.length));
  chosen.push(...takeBalanced(bank.filter(q=>!chosen.includes(q)),count-chosen.length));
  return shuffle(chosen);
}

function cumulativeLevel4Builders(index){
  const sentences=level4SentencePool(index),current=sentences.filter(s=>(s.reviewAt??s.introducedAt)===index);
  const exact=weightedLevel4Pick((current.length?current:sentences).map(s=>({
    introducedAt:s.reviewAt??s.introducedAt,sentence:s
  })),2,index).map(({sentence})=>[sentence.meaning,sentence.tokens.join(' '),shuffle(sentence.tokens)]);
  const free=level4FreeBuilder(index,sentences);
  return free?[...exact,[free[0],free[1][0],free[2],free[1]]]:exact;
}

  const candidateIndex=rankIndex(candidate);

  if(candidateIndex>=prevIndex){
    rec.rank=candidate;
    return;
  }

  // Hysteresis: a single incident does not instantly destroy strong knowledge.
  // A downgrade only happens when recent performance itself is unstable,

function recordMasteryResult(rec,ok,direction='general',context='general'){
  if(!rec)return;

  if(ok)rec.correct++;
  else rec.incorrect++;

  if(!rec.directionStats[direction])rec.directionStats[direction]=blankDirectionStats();
  const ds=rec.directionStats[direction];
  ds.seen++;
  if(ok)ds.correct++;
  else ds.incorrect++;

  let delta=ok?MASTERY_CONFIG.correctDelta:MASTERY_CONFIG.incorrectDelta;
  if(ok&&rec.lastInteractionAt&&now-rec.lastInteractionAt<MASTERY_CONFIG.repeatWindowMs){
    // Very rapid repetition still counts as an interaction, but is deliberately
    // worth less mastery so one trivial drill cannot cheaply farm Platinum.
    delta=rec.lastDirection===direction?.35:.70;
  }
  rec.masteryScore=Math.max(0,Math.min(100,Math.round((rec.masteryScore+delta)*100)/100));
  rec.lastSeen=now;
  rec.lastInteractionAt=now;
  rec.lastDirection=direction;
  rec.contexts[context]=(rec.contexts[context]||0)+1;
  rec.recentResults.push({ok:!!ok,at:now,direction,context});
  if(rec.recentResults.length>MASTERY_CONFIG.recentWindow){
    rec.recentResults=rec.recentResults.slice(-MASTERY_CONFIG.recentWindow);

function navigateBack(){
  if(!$('sceneTransition').hidden){scenes.cancel();return}
  if(!$('sessionView').classList.contains('hidden')){state.screen='home';scheduleSave();return setMain()}
  if(!$('flashcardView').classList.contains('hidden')||state.screen==='flashcards'){state.screen='home';scheduleSave();return renderMain()}
  // Een quiz of resultaat is één tijdelijke laag boven de plek waar hij begon.
  // De onderliggende module-/lesstaat blijft intact, dus keer daar direct naar terug.
  if(!$('quizView').classList.contains('hidden')){completeStudySession({status:'afgebroken'});return setMain()}
  if(!$('resultView').classList.contains('hidden'))return setMain();
  if(state.screen==='module'&&state.level>=10){
    if(state.studyTracker.active?.source==='lesson:thematic')completeStudySession({status:'verlaten'});
    state.thematic.step=state.thematic.step==='lesson'?'list':state.thematic.step==='list'?'list':'lesson';
    if(state.thematic.step==='list')state.screen='level';
    scheduleSave();return renderMain();
  }
  // Level 4 heeft een extra hiërarchie: lesstap → lesoverzicht → lessenlijst.
  if(state.screen==='module'&&state.level===3&&state.tabs.lang==='learn'&&state.langView==='lesson'){
    if(state.studyTracker.active?.source==='lesson:lang')completeStudySession({status:'verlaten'});
    if(state.langStep!=='overview'){
      state.langStep='overview';
    }else{
      state.langView='list';
    }
    scheduleSave();
    return renderMain();
  }
  if(state.screen==='module'&&state.level>=5&&state.tabs.advanced==='learn'&&state.advancedView[state.level]==='lesson'){
    if(state.studyTracker.active?.source==='lesson:advanced')completeStudySession({status:'verlaten'});
    if(state.advancedStep[state.level]!=='overview')state.advancedStep[state.level]='overview';
    else state.advancedView[state.level]='list';
    scheduleSave();
    return renderMain();
  }
  const parent=navigation.parentOf(state.screen,{courseId:state.courseId});
  if(parent){state.screen=parent;scheduleSave();return renderMain()}
}

function hasJourneyActivity(){
  return Object.values(rankState).some(x=>x.rank||x.attempts>0)
    ||state.level>0
    ||state.basisModule!=='hiragana'
    ||state.row.hiragana>0
    ||state.row.katakana>0
    ||state.step.hiragana>0
    ||state.step.katakana>0
    ||state.numberLesson>0
    ||state.dakPattern>0
    ||state.langLesson>0

    return{title:`Ga verder met ${script}`,detail:`Rij ${state.row[key]+1} · ${row?.name||'Basis'}`,button:'Verder leren →',action:()=>openModule(0)};
  }

function phaseProgressInfo(phase){

function addDesktopSliderControls(grid,label){
  const shell=document.createElement('div');
  shell.className='level-slider-shell';
  const previous=document.createElement('button'),next=document.createElement('button');
  previous.type=next.type='button';
  previous.className=next.className='level-slider-arrow';
  previous.setAttribute('aria-label',`Vorige levels in ${label}`);
  next.setAttribute('aria-label',`Volgende levels in ${label}`);
  previous.innerHTML='&#8249;';
  next.innerHTML='&#8250;';
  grid.replaceWith(shell);
  shell.append(previous,grid,next);
  const update=()=>{
    const max=Math.max(0,grid.scrollWidth-grid.clientWidth);
    previous.disabled=grid.scrollLeft<=2;
    next.disabled=grid.scrollLeft>=max-2;
  };
  const move=direction=>{
    const card=grid.querySelector('.level-menu-card');
    const gap=parseFloat(getComputedStyle(grid).columnGap)||9;
    grid.scrollBy({left:direction*((card?.getBoundingClientRect().width||grid.clientWidth)+gap),behavior:'smooth'});
  };
  previous.onclick=()=>move(-1);
  next.onclick=()=>move(1);
  grid.addEventListener('scroll',update,{passive:true});
  if('ResizeObserver' in window)new ResizeObserver(update).observe(grid);
  requestAnimationFrame(update);
}

function centerPhaseLevel(grid,preferred=state.level){
  if(!grid||!grid.clientWidth)return;
  const cards=[...grid.querySelectorAll('[data-level-index]')];
  const target=cards.find(card=>Number(card.dataset.levelIndex)===preferred)
    ||cards.find(card=>!levelRank(Number(card.dataset.levelIndex)))
    ||cards[0]||grid.querySelector('.level-menu-card');
  if(!target)return;
  grid.scrollLeft=Math.max(0,target.offsetLeft-grid.offsetLeft-(grid.clientWidth-target.clientWidth)/2);
}

function startThematicPart(part){

function thematicAdvance(step){state.thematic.step=step;state.thematic.questionIndex=0;state.thematic.answered=false;state.thematic.selected=null;scheduleSave();renderMain()}
function thematicFinishPart(){
  const lesson=thematicLesson(),part=state.thematic.part;
  if(!state.thematicCompleted[lesson.id])state.thematicCompleted[lesson.id]={A:false,B:false};
  state.thematicCompleted[lesson.id][part]=true;
  if(!state.thematicScores[lesson.id])state.thematicScores[lesson.id]={A:0,B:0};
  state.thematicScores[lesson.id][part]=state.thematic.correct;
  completeStudySession({status:'afgerond',result:{score:state.thematic.correct,total:thematicPart().wordIds.length+thematicPart().questions.length}});
  thematicAdvance('done');
}
function thematicAnswer(answer,correct){
  if(state.thematic.answered)return;
  state.thematic.answered=true;state.thematic.selected=answer;
  if(answer===correct)state.thematic.correct++;
  scheduleSave();renderMain();
}
function thematicNextQuestion(length,nextStep){

function thematicOrderedChoices(choices){

function thematicChoiceHtml(question,kind){
  const answered=state.thematic.answered,chosen=state.thematic.selected;
  return`<section class="card"><div class="eyebrow">${kind}</div><div class="h2">${escapeHtml(question.prompt)}</div><div class="thematic-choices">${question.choices.map((choice,index)=>`<button class="btn thematic-choice ${answered&&choice===question.answer?'is-correct':answered&&choice===chosen?'is-incorrect':''}" data-thematic-choice="${index}" ${answered?'disabled':''}>${escapeHtml(choice)}</button>`).join('')}</div>${answered?`<div class="notice" role="status">${chosen===question.answer?'Goed!':`Het juiste antwoord is: ${escapeHtml(question.answer)}.`}</div><button class="btn primary" id="thematicNext" style="width:100%;margin-top:10px">Volgende →</button>`:''}</section>`;
}
function thematicReadingHtml(text){
  return text.split(/(\s+|[。、：])/u).map(token=>{
    if(!token.trim())return token.includes('\n')?token.replace(/\n/g,'<br>'):' ';
    const word=vocabCatalog.find(item=>!item.legacy&&item.jp===token);
    return word?`<button type="button" class="thematic-token" data-dictionary-open="${escapeHtml(word.id)}">${escapeHtml(token)}</button>`:escapeHtml(token);
  }).join('');
}
function renderThematicCourse(box){
  const course=thematicCourse();if(!course)return;
  if(state.thematic.level!==course.number)state.thematic={level:course.number,lessonIndex:0,part:'A',step:'list',questionIndex:0,correct:0,answered:false,selected:null};
  if(state.screen==='level')state.thematic.step='list';
  if(state.thematic.step==='list')return renderThematicList(box,course);

}

function kanaChunks(row){return row.kana.length===5?[row.kana.slice(0,3),row.kana.slice(3)]:[row.kana.slice()]}
function rowItems(key,i){return kanaModules[key].rows[i].kana.map(([front,back])=>({id:`${key}-${front}`,front,back}))}

function clusterItems(key,idx){return kanaClusters[idx].rows.flatMap(i=>rowItems(key,i))}
function renderKana(box,key){const m=kanaModules[key];box.innerHTML=`<div class="stack" style="margin-top:10px"><section class="card"><div class="h1">${m.label}</div><div class="muted">${key==='hiragana'?'Nieuwe rijen leer je apart; oefenen gebeurt over meerdere rijen.':'De klanken ken je al; je leert vooral de tweede vorm.'}</div></section>${tabsHtml(key)}<div id="kanaBody"></div></div>`;bindTabs(key);if(state.tabs[key]==='learn')renderKanaLearn(key);else if(state.tabs[key]==='practice')renderKanaPractice(key);else renderKanaExams(key)}
function renderKanaLearn(key){
  const body=$('kanaBody'),m=kanaModules[key],ri=state.row[key],row=m.rows[ri],chunks=kanaChunks(row),max=chunks.length+1;
  state.step[key]=Math.min(state.step[key],max-1);

    const label=i<chunks.length?`Stap ${i+1} · ${chunks[i].map(x=>x[0]).join(' / ')}`:`Stap ${i+1} · volledige rij`;

        <div class="muted">${full?'Alle tekens van deze rij samen gemixt. Alleen deze volledige rij kan de rij-rank verhogen.':'Klein blok nieuwe tekens; deze stap heeft geen rank.'}</div>

    <button id="startLearn" class="btn primary" style="width:100%;margin-top:11px">${full?'Volledige rij oefenen':'Oefen deze stap'}</button>

  </section>`;

        <div><div class="h2">Bewaarde fouten</div><div class="small">Fouten uit eerdere sessies blijven lokaal bewaard en kunnen opnieuw worden geoefend.</div></div>

      </div>
      <div class="grid2" style="margin-top:10px">
        <button id="weakKana" class="btn">Oefen zwakke kana</button>

      </div>
    </section>
  </div>`;

  const rowGrid=$('rowSelection');
  const charGrid=$('characterSelection');

  function updateSummary(){
    const rows=state.practiceSelections[key]||[];

    rows.forEach(i=>rowItems(key,i).forEach(it=>unique.set(it.id,it)));

    const parts=[];

    if(chars.length)parts.push(`${chars.length} losse ${chars.length===1?'kana':'kana'}`);
    $('kanaSelectionSummary').textContent=parts.length

      :'Nog niets geselecteerd.';

  kanaModules[key].rows.forEach((r,i)=>{

      scheduleSave();

    rowGrid.appendChild(label);
  });

  allKana(key).forEach(it=>{
    const label=document.createElement('label');

    label.className='char-select-tile'+(isSelected?' selected':'');

    const input=label.querySelector('input');
    input.onchange=()=>{
      label.classList.toggle('selected',input.checked);
      state.practiceSelections[charKey]=[...charGrid.querySelectorAll('input:checked')].map(x=>x.value);
      updateSummary();
      scheduleSave();
    };
    charGrid.appendChild(label);
  });

  $('selectAllRows').onclick=()=>{
    state.practiceSelections[key]=kanaModules[key].rows.map((_,i)=>i);
    scheduleSave();
    renderMain();
  };
  $('clearRows').onclick=()=>{
    state.practiceSelections[key]=[];
    scheduleSave();
    renderMain();
  };
  $('selectAllChars').onclick=()=>{
    state.practiceSelections[charKey]=allKana(key).map(it=>it.id);
    scheduleSave();
    renderMain();
  };
  $('clearChars').onclick=()=>{
    state.practiceSelections[charKey]=[];
    scheduleSave();
    renderMain();

  $('weakKana').onclick=()=>startWeakMasteryPractice(key);$('savedErrors').onclick=()=>practiceErrorBank(key);

  updateSummary();
}

}

  state.studyTracker.active=null;saveProgress();return session;
}

function renderKanaQ(c,q,box){
  box.className='choices';
  const explicitDakuten=q.mode==='reverse'&&hasDakutenSourceContext(q);
  $('qPrompt').textContent=q.mode==='forward'?q.item.front:explicitDakuten?dakutenReversePrompt(q.item):q.item.back;

  let source=[...(c.pool||[])];
  if(source.length<3 && c.source==='hiragana')source=allKana('hiragana');
  if(source.length<3 && c.source==='katakana')source=allKana('katakana');
  if(source.length<3 && c.source==='mix')source=mixItems();

  // Reverse questions need context whenever the same sound can point to more
  // than one written form. Kana Mix specifies the requested script; Dakuten
  // additionally specifies the transformation pattern when required.
  if(q.mode==='reverse'){
    let contextSource=source;
    const context=[];

    if(q.item.script){
      contextSource=contextSource.filter(x=>x.script===q.item.script);
      context.push(q.item.script==='hiragana'?'Hiragana':'Katakana');
    }

    const sameReading=contextSource.filter(x=>x.back===q.item.back);
    if(sameReading.length>1 && q.item.pattern){
      contextSource=contextSource.filter(x=>x.pattern===q.item.pattern);
      const pat=dakutenPatterns.find(p=>p.id===q.item.pattern);
      if(pat)context.push(pat.name);
    }

    source=contextSource;
    $('qHint').textContent=explicitDakuten
      ?`Kies de juiste ${q.item.script==='hiragana'?'Hiragana':'Katakana'}-transformatie · ${dakutenPatterns.find(p=>p.id===q.item.pattern)?.name||''}`
      :context.length?`Welk ${context.join(' · ')}-teken hoort bij deze klank?`:'Welk teken hoort bij deze klank?';
  }else{
    $('qHint').textContent='Welke klank hoort hierbij?';
  }

  const labelFor=it=>q.mode==='forward'?it.back:it.front;
  const correctLabel=labelFor(q.item);
  const wanted=Math.max(2,Math.min(c.choices||3,source.length));

  // Build distractors by VISIBLE answer label, not by item id.
  // Hiragana り and Katakana リ are different items but both display "ri"
  // in a forward question; only one "ri" option may therefore be shown.
  const seen=new Set([correctLabel]);
  const distractors=[];
  for(const it of shuffle(source)){
    if(it.id===q.item.id)continue;
    const label=labelFor(it);
    if(seen.has(label))continue;
    seen.add(label);
    distractors.push(it);
    if(distractors.length>=wanted-1)break;
  }

  const opts=shuffle([q.item,...distractors]);
  opts.forEach(it=>{
    const label=labelFor(it);
    // Extra safety: in Kana -> sound, correctness follows the displayed
    // sound itself. An identical visible answer can never be marked wrong.
    const isCorrect=q.mode==='forward'
      ? label===correctLabel
      :explicitDakuten?it.id===q.item.id:it.id===q.item.id||it.back===q.item.back;
    addChoice(box,label,isCorrect);
  });
}
function renderScriptReverseQ(c,q,box){const explicitDakuten=hasDakutenSourceContext(q);$('qHint').textContent=explicitDakuten?`${q.script} · ${dakutenPatterns.find(p=>p.id===q.item.pattern)?.name||'transformatie'}`:`${q.item.back} — kies ${q.script}`;$('qPrompt').textContent=explicitDakuten?dakutenReversePrompt(q.item):q.item.back;const same=c.pool.filter(x=>x.script===q.item.script&&x.id!==q.item.id),opts=shuffle([q.item,...shuffle(same).slice(0,8)]);opts.forEach(it=>addChoice(box,it.front,explicitDakuten?it.id===q.item.id:it.id===q.item.id||it.back===q.item.back))}

function questionSignature(q){
  if(!q)return'unknown';
  if(q.type==='kana')return`kana|${q.mode}|${q.item?.id||q.item?.front||''}`;
  if(q.type==='scriptReverse')return`scriptReverse|${q.script}|${q.item?.id||q.item?.front||''}`;
  if(q.type==='number')return`number|${q.from}|${q.to}|${q.item?.id||q.item?.valueText||''}`;
  if(q.type==='math')return`math|${q.a}|${q.op}|${q.b}|${q.answer}`;
  return`lesson|${q.kind||''}|${q.prompt||''}|${q.correct||''}`;
}
function mergeErrorBank(source,mistakes){
  if(!state.errorBank[source])state.errorBank[source]=[];
  const bank=state.errorBank[source];
  mistakes.forEach(m=>{
    const q=m.question;
    if(!q)return;
    // A visibly identical answer is never a real learning error.
    if(String(m.chosen).trim()===String(m.correct).trim())return;
    const key=questionSignature(q);
    const found=bank.find(e=>e.key===key);
    if(found){
      found.count=Math.min(20,(found.count||1)+1);
      found.lastAt=Date.now();
      found.question=structuredClone(q);
      found.asked=m.asked;found.correct=m.correct;found.detail=m.detail;
    }else{
      bank.push({key,count:1,lastAt:Date.now(),question:structuredClone(q),asked:m.asked,correct:m.correct,detail:m.detail});
    }
  });
  bank.sort((a,b)=>(b.count-a.count)||(b.lastAt-a.lastAt));
  if(bank.length>80)bank.length=80;
}
function resolveErrorBank(source,q){
  const bank=state.errorBank[source]||[];
  const key=questionSignature(q);
  const i=bank.findIndex(e=>e.key===key);
  if(i<0)return;
  bank[i].count=Math.max(0,(bank[i].count||1)-1);
  bank[i].lastAt=Date.now();
  if(bank[i].count<=0)bank.splice(i,1);
}
function smallErrorEntries(){return(state.errorBank.small||[]).filter(e=>e.question?.learningGoal)}
function practiceErrorBank(source){
  const bank=(state.errorBank[source]||[]).filter(e=>e.question&&(source!=='small'||e.question.learningGoal));
  if(!bank.length)return;
  const weighted=[];
  bank.forEach(e=>{
    const reps=Math.min(4,Math.max(1,e.count||1));
    for(let i=0;i<reps;i++)weighted.push(structuredClone(e.question));
  });
  const questions=[];
  const target=Math.min(20,Math.max(8,weighted.length));
  let last='';
  for(let i=0;i<target;i++){
    let q=null;
    for(let tries=0;tries<30;tries++){
      const candidate=structuredClone(weighted[Math.floor(Math.random()*weighted.length)]);
      const sig=questionSignature(candidate);
      if(sig!==last||weighted.length===1){q=candidate;last=sig;break}
    }
    if(!q)q=structuredClone(weighted[i%weighted.length]);
    questions.push(q);
  }
  const fallbackPool=source==='hiragana'?allKana('hiragana'):source==='katakana'?allKana('katakana'):source==='mix'?mixItems():source==='dakuten'?allDakItems():source==='numbers'?numberItems([...range(0,99),100,200,300,400,500,600,700,800,900,1000,2000,3000,5000,8000,10000]):[];
  startQuiz({source,title:'Moeilijke punten · opgeslagen fouten',official:false,errorBankPractice:true,pool:fallbackPool,questions,choices:9});
}

function levelLessonIds(level){
  if(level===0)return[
    ...kanaModules.hiragana.rows.map((_,i)=>`hiragana-row-${i}`),
    ...numberLessons.filter(x=>x.official&&x.id).map(x=>x.id),
    ...kanaModules.katakana.rows.map((_,i)=>`katakana-row-${i}`)
  ];
  if(level===1)return[];
  if(level===2)return dakutenPatterns.flatMap(p=>[`dak-hiragana-${p.id}`,`dak-katakana-${p.id}`]);
  if(level===3)return langLessons.map(x=>x.id);
  if(level===4)return smallLessons.map(x=>x.id);
  if(level>=5&&level<=9)return advancedCourses[level].lessons.map(x=>x.id);
  if(level>=10&&level<=11)return thematicCourses[level].lessons.map(x=>x.id);

}

function recommendedNextStep(){
  const weakH=weakMasteryItems('hiragana').filter(x=>masteryReviewRecommended(itemMastery[x.id]));
  const weakK=weakMasteryItems('katakana').filter(x=>masteryReviewRecommended(itemMastery[x.id]));
  if(weakH.length>=3)return'Oefen zwakke Hiragana: meerdere tekens zijn recent instabiel.';
  if(weakK.length>=3)return'Oefen zwakke Katakana: meerdere tekens zijn recent instabiel.';

  for(const script of ['hiragana','katakana']){
    const row=kanaModules[script].rows.findIndex((_,i)=>!rankState[`${script}-row-${i}`]?.rank);
    if(row>=0)return`${script==='hiragana'?'Hiragana':'Katakana'} · ${kanaModules[script].rows[row].name} volledig oefenen.`;
    for(const exam of ['exam1','exam2','exam3']){
      if(!rankState[`${script}-${exam}`]?.rank)return`${script==='hiragana'?'Hiragana':'Katakana'} · ${exam.replace('exam','Examen ')}.`;
    }
    if(script==='hiragana'){
      for(const id of ['num-basic','num-teens','num-tens','num-under100','num-hundreds','num-thousands']){
        if(!rankState[id]?.rank)return`Cijfers · ${defsCache[id]?.name||id}.`;
      }
    }
  }
  for(const id of ['mix-exam1','mix-exam2']){
    if(!rankState[id]?.rank)return`Kana Mix · ${defsCache[id]?.name||id}.`;
  }
  for(const p of dakutenPatterns){
    for(const script of ['hiragana','katakana']){
      const id=`dak-${script}-${p.id}`;
      if(!rankState[id]?.rank)return`Dakuten · ${script==='hiragana'?'Hiragana':'Katakana'} · ${p.name}.`;
    }
  }
  for(const id of ['dak-examA','dak-examB']){
    if(!rankState[id]?.rank)return`Dakuten · ${defsCache[id]?.name||id}.`;
  }
  const lang=langLessons.find(l=>!rankState[l.id]?.rank);
  if(lang)return`Level 4 · ${lang.title}.`;
  if(!rankState['l4-exam']?.rank)return'Level 4 · level-examen.';
  const small=smallLessons.find(l=>!rankState[l.id]?.rank);
  if(small)return`Level 5 · ${small.title}.`;
  if(!rankState['l5-exam']?.rank)return'Level 5 · level-examen.';
  for(let level=5;level<=9;level++){
    const course=advancedCourses[level],lesson=course.lessons.find(l=>!rankState[l.id]?.rank);
    if(lesson)return`Level ${course.number} · ${lesson.title}.`;
    if(!rankState[`l${course.number}-exam`]?.rank)return`Level ${course.number} · level-examen.`;
  }
  for(let level=10;level<=11;level++){
    const course=thematicCourses[level],lesson=course.lessons.find(l=>thematicProgress(l)<2);
    if(lesson)return`Level ${course.number} · ${lesson.title}.`;
    if(!rankState[`l${course.number}-exam`]?.rank)return`Level ${course.number} · levelcheck.`;
  }
  return'De huidige route is afgerond. Oudere lessen blijven beschikbaar om opnieuw te lezen.';
}
