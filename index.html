  $('studyForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),startedAt=new Date(fd.get('startedAt')).toISOString(),effectiveSeconds=Math.max(0,Number(fd.get('effectiveMinutes'))*60),current=session||{};const updated=normalizeStudySession({...current,id:current.id||studyId('manual'),title:String(fd.get('title')).trim(),startedAt,endedAt:current.endedAt||startedAt,rawSeconds:Number(current.rawSeconds ?? effectiveSeconds),effectiveSeconds,category:String(fd.get('category')),activityType:String(fd.get('activityType')).trim()||'zelfstudie',level:Number(fd.get('level'))||null,difficulty:Number(fd.get('difficulty'))||null,comprehension:Number(fd.get('comprehension'))||null,tags:String(fd.get('tags')).split(',').map(x=>x.trim()).filter(Boolean),skills:String(fd.get('skills')).split(',').map(x=>x.trim()).filter(Boolean),note:String(fd.get('note')).trim(),manual:true,baseline,snapshotStart:current.snapshotStart||knowledgeSnapshot(),snapshotEnd:current.snapshotEnd||knowledgeSnapshot()});if(session){const i=state.studyTracker.sessions.findIndex(x=>x.id===session.id);state.studyTracker.sessions[i]=updated}else state.studyTracker.sessions.push(updated);if(!state.studyTracker.courseStartedAt||new Date(startedAt)<new Date(state.studyTracker.courseStartedAt))state.studyTracker.courseStartedAt=startedAt;studyEditingId=null;saveProgress();renderStudyActivities(box)};
}
function renderStudyActivities(box){
  const sessions=filteredStudySessions().sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)),editing=studyEditingId&&studyEditingId!=='new'&&studyEditingId!=='baseline'?state.studyTracker.sessions.find(s=>s.id===studyEditingId):null;
  box.innerHTML=`<section class="card"><div class="between"><div><div class="h2">Activiteiten</div><div class="muted">Automatische en handmatige sessies blijven volledig aanpasbaar.</div></div><button id="addStudy" class="btn primary">+ Toevoegen</button></div><div class="study-presets" style="margin-top:10px">${[['today','Vandaag'],['week','Deze week'],['month','Deze maand'],['30','Laatste 30 dagen'],['year','Dit jaar'],['all','Alles']].map(([id,label])=>`<button class="btn tiny" data-calendar="${id}">${label}</button>`).join('')}</div><div class="study-form-grid" style="margin-top:10px"><label>Van<input id="studyFrom" type="date" value="${state.studyCalendar.from}"></label><label>Tot<input id="studyTo" type="date" value="${state.studyCalendar.to}"></label><label>Categorie<select data-study-filter="category"><option value="">Alle categorieën</option>${Object.entries(studyCategoryLabels).map(([k,v])=>`<option value="${k}" ${state.studyFilters.category===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Bron<select data-study-filter="origin"><option value="">Automatisch + handmatig</option><option value="auto" ${state.studyFilters.origin==='auto'?'selected':''}>Automatisch</option><option value="manual" ${state.studyFilters.origin==='manual'?'selected':''}>Handmatig</option></select></label><label>Level<input data-study-filter="level" type="number" min="1" placeholder="Alle" value="${escapeHtml(state.studyFilters.level)}"></label><label>Vaardigheid<input data-study-filter="skill" placeholder="bijv. luisteren" value="${escapeHtml(state.studyFilters.skill)}"></label><label>Tag<input data-study-filter="tag" placeholder="bijv. manga" value="${escapeHtml(state.studyFilters.tag)}"></label></div></section>${studyEditingId?studyFormHtml(editing,studyEditingId==='baseline'):''}<div id="studySessionList" class="stack">${sessions.length?sessions.map(s=>`<section class="card session-row"><div><strong>${escapeHtml(s.title)}</strong><div class="small">${studyDateTimeLabel(s.startedAt)} · raw ${formatDuration(s.rawSeconds,true)} · effectief ${formatDuration(s.effectiveSeconds,true)}</div><div class="session-meta"><span class="session-tag">${studyCategoryLabels[s.category]}</span>${s.activityType?`<span class="session-tag">${escapeHtml(s.activityType)}</span>`:''}${s.manual?'<span class="session-tag">handmatig</span>':''}${s.difficulty?`<span class="session-tag">moeilijkheid ${s.difficulty}/5</span>`:''}${s.comprehension?`<span class="session-tag">begrip ${s.comprehension}/5</span>`:''}</div>${s.note?`<div class="small" style="margin-top:6px">${escapeHtml(s.note)}</div>`:''}</div><div class="session-actions"><button class="btn tiny" data-edit-session="${s.id}">Bewerk</button><button class="btn tiny" data-delete-session="${s.id}">Wis</button></div></section>`).join(''):'<section class="card">Nog geen activiteiten voor deze filters.</section>'}</div>`;
  $('addStudy').textContent='Activiteit toevoegen';$('addStudy').onclick=()=>{studyEditingId='new';renderStudyActivities(box)};$('studyFrom').onchange=e=>{state.studyCalendar.from=e.target.value;scheduleSave();renderStudyActivities(box)};$('studyTo').onchange=e=>{state.studyCalendar.to=e.target.value;scheduleSave();renderStudyActivities(box)};root.querySelectorAll('[data-calendar]').forEach(b=>b.onclick=()=>{setStudyCalendarPreset(b.dataset.calendar);scheduleSave();renderStudyActivities(box)});root.querySelectorAll('[data-study-filter]').forEach(el=>el.onchange=()=>{state.studyFilters[el.dataset.studyFilter]=el.value;scheduleSave();renderStudyActivities(box)});
  if(studyEditingId)bindStudyForm(box,editing,studyEditingId==='baseline');
  root.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick=()=>{studyEditingId=b.dataset.editSession;renderStudyActivities(box)});
  root.querySelectorAll('[data-delete-session]').forEach(b=>b.onclick=()=>{if(!confirm('Deze activiteit verwijderen? Uren en analyses worden daarna opnieuw berekend.'))return;state.studyTracker.sessions=state.studyTracker.sessions.filter(s=>s.id!==b.dataset.deleteSession);state.studyTracker.events=state.studyTracker.events.filter(e=>e.sessionId!==b.dataset.deleteSession);saveProgress();renderStudyActivities(box)});
}
function setStudyDisclosure(buttonId,panelId,open){const button=$(buttonId),panel=$(panelId);if(!button||!panel)return;button.setAttribute('aria-expanded',String(open));panel.hidden=!open}
function bindStudyDisclosure(buttonId,panelId){const button=$(buttonId);if(button)button.onclick=()=>setStudyDisclosure(buttonId,panelId,button.getAttribute('aria-expanded')!=='true')}
function renderProgressSectionSafely(hostId,label,render){try{render()}catch(error){console.error(`Voortgangsonderdeel niet geladen: ${label}`,error);const host=$(hostId);if(host){host.dataset.renderError=String(error?.message||error);host.innerHTML=`<div class="panel" role="alert">${label} kon niet worden geladen. Je opgeslagen voortgang is behouden.</div>`}}}
function renderProgressDashboard(box){
  const sessions=studySessions(),totals=studyTotals(sessions),groups=[['exam','Examens'],['practice','Oefenen'],['app','App-lessen']],recent=[...sessions].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));
  box.innerHTML=`${legacyStudyNotice()}<section class="card"><div class="between"><div><div class="h2">Voortgang</div><div class="muted">Effectieve tijd is leidend; studietijd verandert geen rank of mastery.</div></div><strong>${formatDuration(totals.total)}</strong></div><div class="category-breakdown">${groups.map(([key,label])=>`<div class="category-bar"><span>${label}</span><div class="category-bar-track"><span style="width:${totals.total?((totals.byCategory[key]||0)/totals.total*100):0}%"></span></div><strong>${formatDuration(totals.byCategory[key]||0,true)}</strong></div>`).join('')}</div></section><section class="card"><div class="h2">Studietijd door de tijd</div><div class="small">Tijd op de horizontale as · aantal bekende woorden en kanji op de verticale as</div>${studyLineChart(sessions)}</section><section class="card study-disclosure-card"><button id="recentActivitiesToggle" class="study-disclosure" type="button" aria-expanded="false" aria-controls="recentActivitiesPanel"><span class="h2">Recente activiteiten (${sessions.length})</span><span class="study-disclosure-icon" aria-hidden="true">⌄</span></button><div id="recentActivitiesPanel" class="study-disclosure-panel" hidden><div class="small">Nieuwste eerst · ${Math.min(state.progressActivityLimit,recent.length)} van ${recent.length}</div><div id="recentActivities" class="stack" style="margin-top:8px"></div><button id="moreActivities" class="btn tiny" style="width:100%;margin-top:8px" ${recent.length>state.progressActivityLimit?'':'hidden'}>Meer tonen</button><button id="activityManagerToggle" class="study-disclosure" type="button" aria-expanded="false" aria-controls="activityManagerPanel" style="margin-top:14px"><span class="small">Activiteiten beheren en geschiedenis filteren</span><span class="study-disclosure-icon" aria-hidden="true">⌄</span></button><div id="activityManagerPanel" class="study-disclosure-panel" hidden><div id="activityManager"></div></div></div></section><section class="card study-disclosure-card"><button id="studyAnalysisToggle" class="study-disclosure" type="button" aria-expanded="false" aria-controls="studyAnalysisPanel"><span class="h2">Urenanalyse</span><span class="study-disclosure-icon" aria-hidden="true">⌄</span></button><div id="studyAnalysisPanel" class="study-disclosure-panel" hidden><div id="studyAnalysisBody"></div></div></section><section class="card study-disclosure-card"><button id="studyTimelineToggle" class="study-disclosure" type="button" aria-expanded="false" aria-controls="studyTimelinePanel"><span class="h2">Tijdlijn</span><span class="study-disclosure-icon" aria-hidden="true">⌄</span></button><div id="studyTimelinePanel" class="study-disclosure-panel" hidden><div id="studyTimelineBody"></div></div></section>`;
  bindStudyDisclosure('recentActivitiesToggle','recentActivitiesPanel');bindStudyDisclosure('activityManagerToggle','activityManagerPanel');bindStudyDisclosure('studyAnalysisToggle','studyAnalysisPanel');bindStudyDisclosure('studyTimelineToggle','studyTimelinePanel');
  renderProgressSectionSafely('activityManager','Activiteiten beheren',()=>renderStudyActivities($('activityManager')));
  renderProgressSectionSafely('studyAnalysisBody','De urenanalyse',()=>renderStudyAnalysis($('studyAnalysisBody')));
  renderProgressSectionSafely('studyTimelineBody','De tijdlijn',()=>renderStudyTimeline($('studyTimelineBody')));
  const drawRecent=()=>{const host=$('recentActivities');host.innerHTML='';recent.slice(0,state.progressActivityLimit).forEach(s=>{const row=document.createElement('div');row.className='panel';row.innerHTML=`<strong>${escapeHtml(s.title)}</strong><div class="small">${studyDateTimeLabel(s.startedAt)} · ${studyCategoryLabels[s.category]} · ${formatDuration(s.effectiveSeconds,true)}</div>`;host.appendChild(row)});$('moreActivities').hidden=recent.length<=state.progressActivityLimit};drawRecent();
  $('moreActivities').onclick=()=>{state.progressActivityLimit=Math.min(recent.length,state.progressActivityLimit+10);scheduleSave();drawRecent()};
  if($('addBaseline'))$('addBaseline').onclick=()=>{setStudyDisclosure('recentActivitiesToggle','recentActivitiesPanel',true);setStudyDisclosure('activityManagerToggle','activityManagerPanel',true);studyEditingId='baseline';renderStudyActivities($('activityManager'))};
  if($('dismissBaseline'))$('dismissBaseline').onclick=()=>{state.studyTracker.noticeDismissed=true;scheduleSave();renderProgressDashboard(box)};
}
function renderStudyAdjustment(sessionId){
  const s=state.studyTracker.sessions.find(x=>x.id===sessionId),card=$('resultStats')?.parentElement;if(!s||!card)return;const minutes=s.effectiveSeconds>0?Math.max(1,Math.round(s.effectiveSeconds/60)):0;let host=$('studyAdjustment');if(!host){host=document.createElement('details');host.id='studyAdjustment';host.className='panel study-adjust';card.appendChild(host)}host.innerHTML=`<summary>Studietijd aanpassen · ${formatDuration(s.effectiveSeconds,true)}</summary><form id="resultStudyForm" class="study-form" style="margin-top:10px"><div class="study-form-grid"><label>Effectieve minuten<input id="resultStudyMinutes" name="minutes" type="number" min="0" value="${minutes}"></label><label>Moeilijkheid 1–5<input name="difficulty" type="number" min="1" max="5" value="${s.difficulty||''}"></label><label>Begrip 1–5<input name="comprehension" type="number" min="1" max="5" value="${s.comprehension||''}"></label></div><div class="study-toolbar"><button class="btn tiny" type="button" data-minute-delta="-5">−5 min</button><button class="btn tiny" type="button" data-minute-delta="-1">−1 min</button><button class="btn tiny" type="button" data-minute-delta="1">+1 min</button><button class="btn tiny" type="button" data-minute-delta="5">+5 min</button></div><label>Notitie<textarea name="note">${escapeHtml(s.note||'')}</textarea></label><button class="btn primary" type="submit">Aanpassing opslaan</button></form>`;root.querySelectorAll('[data-minute-delta]').forEach(b=>b.onclick=()=>{$('resultStudyMinutes').value=Math.max(0,Number($('resultStudyMinutes').value||0)+Number(b.dataset.minuteDelta))});$('resultStudyForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);s.effectiveSeconds=Math.max(0,Number(fd.get('minutes'))*60);s.difficulty=Number(fd.get('difficulty'))||null;s.comprehension=Number(fd.get('comprehension'))||null;s.note=String(fd.get('note')).trim();saveProgress();renderStudyAdjustment(sessionId)};
}
function renderProgressKnowledge(box){
  box.innerHTML=`<div class="progress-tabs"><button class="progress-tab ${state.progressKnowledgeTab==='levels'?'active':''}" data-knowledge="levels">Levels</button><button class="progress-tab ${state.progressKnowledgeTab==='kana'?'active':''}" data-knowledge="kana">Kana</button><button class="progress-tab ${state.progressKnowledgeTab==='vocab'?'active':''}" data-knowledge="vocab">Vocabulaire</button><button class="progress-tab ${state.progressKnowledgeTab==='dictionary'?'active':''}" data-knowledge="dictionary">Dictionary</button><button class="progress-tab ${state.progressKnowledgeTab==='skills'?'active':''}" data-knowledge="skills">Vaardigheden</button><button class="progress-tab ${state.progressKnowledgeTab==='avatar'?'active':''}" data-knowledge="avatar">Profiel</button></div><div id="knowledgeBody" class="stack"></div>`;
  root.querySelectorAll('[data-knowledge]').forEach(b=>b.onclick=()=>{state.progressKnowledgeTab=b.dataset.knowledge;state.progressDetailId=null;state.progressVocabDetailId=null;scheduleSave();renderProgressKnowledge(box)});const body=$('knowledgeBody');if(state.progressKnowledgeTab==='kana')renderProgressKanaTab(body);else if(state.progressKnowledgeTab==='vocab')renderProgressVocabTab(body);else if(state.progressKnowledgeTab==='dictionary')renderDictionaryTab(body);else if(state.progressKnowledgeTab==='skills')renderProgressSkillsTab(body);else if(state.progressKnowledgeTab==='avatar')renderAvatarSettings(body);else renderProgressLevelTab(body)
}
function renderSession(){
  show('session');updateHeader();$('sessionView').querySelector('.card .h1').textContent=t('progress.heroTitle');$('sessionView').querySelector('.card .muted').textContent=t('progress.heroIntro');$('sessionBack').textContent=t('common.back');const box=$('sessionContent');box.innerHTML=`<div class="progress-tabs" role="tablist" aria-label="${t('progress.title')}"><button class="progress-tab ${state.progressTab==='profile'?'active':''}" data-progress="profile" role="tab" aria-selected="${state.progressTab==='profile'}">${t('progress.profile')}</button><button class="progress-tab ${state.progressTab==='progress'?'active':''}" data-progress="progress" role="tab" aria-selected="${state.progressTab==='progress'}">${t('progress.title')}</button><button class="progress-tab ${state.progressTab==='knowledge'?'active':''}" data-progress="knowledge" role="tab" aria-selected="${state.progressTab==='knowledge'}">${t('progress.knowledge')}</button></div><div id="progressBody" class="stack"></div>`;root.querySelectorAll('[data-progress]').forEach(b=>b.onclick=()=>{state.progressTab=b.dataset.progress;state.progressDetailId=null;state.progressVocabDetailId=null;studyEditingId=null;scheduleSave();renderSession()});const body=$('progressBody');if(state.progressTab==='profile')renderProfileDashboard(body);else if(state.progressTab==='knowledge')renderKnowledgeDashboard(body);else renderProgressDashboard(body)
}

function toggleProgress(){
  if(!$('sessionView').classList.contains('hidden'))navigateBack();
  else renderSession();
}
function goToLearningHome(){
  if(state.studyTracker.active)completeStudySession({status:'verlaten'});
  state.screen='home';
  scheduleSave();
  renderMain();
}
function goToLevels(){
  if(state.studyTracker.active)completeStudySession({status:'verlaten'});
  state.screen='levels';
  scheduleSave();
  renderMain();
}
$('sessionBtn').onclick=toggleProgress;
$('learnNav').onclick=goToLevels;
$('flashcardsNav').onclick=openFlashcards;
$('sessionBack').onclick=navigateBack;
$('navBack').onclick=navigateBack;
$('navHome').onclick=goToLearningHome;
$('dictionaryClose').onclick=closeDictionaryModal;
$('dictionaryModal').addEventListener('click',event=>{if(event.target===$('dictionaryModal'))closeDictionaryModal()});
document.addEventListener('click',event=>{const button=event.target.closest('[data-dictionary-open]');if(!button)return;event.preventDefault();event.stopPropagation();openDictionaryModal(button.dataset.dictionaryOpen,button.dataset.dictionaryLesson,button.dataset.dictionarySentence,button.dataset.dictionaryMeaning)},true);
document.addEventListener('keydown',event=>{const modal=$('dictionaryModal');if(modal.classList.contains('hidden'))return;if(event.key==='Escape'){event.preventDefault();closeDictionaryModal();return}if(event.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
$('quitQuiz').onclick=()=>{completeStudySession({status:'afgebroken'});setMain()};
$('backBtn').onclick=setMain;
$('practiceErrors').onclick=practiceCurrentErrors;
$('retryBtn').onclick=retryCurrent;

root.addEventListener('click',scheduleSave);
root.addEventListener('change',scheduleSave);
window.addEventListener('resize',()=>{detectLayout();updateStorageUI()},{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(()=>{detectLayout();updateStorageUI()},120),{passive:true});
window.addEventListener('pagehide',pauseActiveStudySession);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseActiveStudySession();else resumeActiveStudySession()});

detectLayout();
loadProgress();
// A new visit starts at the active course home; the saved lesson position remains available through Continue.
state.screen='home';
document.documentElement.lang=state.uiLanguage;
recoverInterruptedStudySession();
renderMain();
updateStorageUI();
if(typeof MutationObserver!=='undefined'&&document.createTreeWalker){
  const localeObserver=new MutationObserver(()=>i18n.localizeNodes(root,state.uiLanguage));
  localeObserver.observe(root,{subtree:true,childList:true,characterData:true});
  i18n.localizeNodes(root,state.uiLanguage);
}
})();
</script>
