<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Language Journey — Japans</title>
<style>

:root{
  color-scheme:light dark;
  --bg:#f4f5f7;
  --card:#ffffff;
  --panel:#f0f2f5;
  --text:#17191c;
  --muted:#6d737c;
  --border:#d8dce2;
  --accent:#4b67d1;
  --accent-soft:#e9edff;
  --good:#2e7d5b;
  --copper:#a56b45;
  --silver:#8c949e;
  --gold:#b88b27;
  --platinum:#67b8ef;
  --jp-question-size:clamp(52px,6.5vw,68px);
  --jp-answer-size:20px;
  --jp-example-size:clamp(27px,4vw,34px);
  --jp-reading-size:clamp(20px,4.5vw,24px);
  --jp-kana-size:44px;
  --jp-body-size:23px;
  --jp-token-size:21px;
  --jp-chip-size:19px;
  --answer-body-size:19px;
  --answer-compact-size:16px;
  --quiz-text-size:clamp(18px,2vw,20px);
  --quiz-jp-size:clamp(26px,3vw,32px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111317;
    --card:#1a1d22;
    --panel:#23272e;
    --text:#f2f4f7;
    --muted:#a8afb9;
    --border:#343941;
    --accent:#8da2ff;
    --accent-soft:#252d50;
    --good:#67c49b
  }
}

*{box-sizing:border-box}
html{
  width:100%;
  min-width:0;
  min-height:100%;
  -webkit-text-size-adjust:100%;
  background:var(--bg);
}
body{
  width:100%;
  min-width:0;
  min-height:100%;
  margin:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
button,select,input{
  font:inherit;
  color:inherit;
  -webkit-tap-highlight-color:transparent;
}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

/* CRITICAL:
   Grid children are allowed to shrink. Without this the horizontal level
   rail makes the whole page wider than an iPhone viewport. */
.app,
.app > *,
.stack,
.stack > *,
main,
section{
  min-width:0;
}
.app{
  width:100%;
  max-width:1120px;
  min-height:100dvh;
  margin:0 auto;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(34px, calc(env(safe-area-inset-bottom) + 22px))
    max(12px, env(safe-area-inset-left));
}
.stack{
  display:grid;
  gap:10px;
  align-content:start; /* Prevent quiz cards from stretching to viewport height */
}
.dictionary-search{width:100%;min-height:48px;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:10px 12px}
.dictionary-results{display:grid;gap:7px;max-height:min(48vh,420px);overflow:auto}
.dictionary-result{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;padding:9px 11px;border:1px solid var(--border);border-radius:12px;background:var(--card);text-align:left}
.dictionary-result small{display:block;color:var(--muted);margin-top:2px}
.dictionary-kind{font-size:11px;color:var(--muted);white-space:nowrap}
.dictionary-entry-title{font-size:34px;font-weight:800;line-height:1.2}
.dictionary-link{border:0;background:none;color:var(--accent);font:inherit;font-weight:650;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px;padding:0 2px;cursor:pointer}
.dictionary-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:#0008}
.dictionary-modal.hidden{display:none}
.dictionary-modal-card{width:min(620px,100%);max-height:88dvh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 20px 60px #0004}
.knowledge-item{display:flex;align-items:stretch;gap:7px;min-width:0}
.knowledge-item>.vocab-progress-row{flex:1;min-width:0;cursor:pointer}
.knowledge-item>.audio-speaker{flex:none;align-self:center;margin:0}
.knowledge-item--plain>.vocab-progress-row{cursor:default}
.dictionary-practice-options{display:grid;gap:8px;margin-top:12px}
.dictionary-practice-options .btn{text-align:left;white-space:normal}
.dictionary-inline-context{border-left:3px solid var(--accent);padding:8px 10px;background:var(--panel);border-radius:0 10px 10px 0}
@media(max-width:520px){.dictionary-entry-title{font-size:30px}.dictionary-modal-card{padding:13px}}
.card{
  width:100%;
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
}
.panel{
  min-width:0;
  background:var(--panel);
  border-radius:13px;
  padding:12px;
}
.between{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  min-width:0;
}
.between>*{min-width:0}
.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}
.grid5{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.h1{font-size:22px;line-height:1.18;font-weight:750}
.h2{font-size:18px;line-height:1.25;font-weight:720}
.eyebrow{
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:11px;
  font-weight:750;
  color:var(--muted)
}

.btn{
  min-height:46px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:12px;
  padding:9px 12px;
  font-weight:650;
}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.btn.tiny{min-height:40px;font-size:13px}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{
  min-height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  font-size:13px;
  font-weight:700;
}
.tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.select{
  width:100%;
  min-width:0;
  min-height:44px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:0 11px
}

/* Level navigation */
.level-nav{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) 40px;
  align-items:stretch;
  gap:6px;
  width:100%;
  min-width:0;
  margin-top:9px;
}
.level-arrow{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:70px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:var(--muted);
  font-size:27px;
  line-height:1;
  touch-action:manipulation;
}
.level-scroll{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
  touch-action:pan-x;
}
.level-scroll::-webkit-scrollbar{display:none}
.levels{
  display:flex;
  flex-wrap:nowrap;
  gap:8px;
  width:max-content;
  min-width:100%;
  min-height:100%;
}
.level{
  flex:0 0 138px;
  width:138px;
  min-width:138px;
  min-height:82px;
  text-align:left;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:14px;
  padding:10px;
  scroll-snap-align:start;
  touch-action:manipulation;
}
.level.active{
  border:2px solid var(--accent);
  background:var(--accent-soft)
}
.level .num{font-size:11px;color:var(--muted);font-weight:750}
.level .name{font-weight:750;margin-top:3px;line-height:1.15}
.level .sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}

/* Learning content */
.kana-card{
  text-align:center;
  background:var(--panel);
  border-radius:12px;
  padding:11px 5px
}
.kana{font-size:var(--jp-kana-size);line-height:1.15;overflow-wrap:anywhere}
.romaji{font-weight:700;margin-top:5px}
.rank{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  width:auto;
  min-width:max-content;
  max-width:100%;
  border:1px solid var(--border);
  border-radius:999px;
  padding:4px 12px;
  font-size:11px;
  line-height:1.1;
  font-weight:750;
  white-space:nowrap
}
.rank-Copper{border-color:var(--copper)}
.rank-Silver{border-color:var(--silver)}
.rank-Gold{border-color:var(--gold)}
.rank-Platinum{border-color:var(--platinum)}
.rank-new{border-color:var(--border)}
.progress{
  height:8px;
  background:var(--panel);
  border-radius:999px;
  overflow:hidden
}
.progress>div{
  height:100%;
  background:var(--accent);
  width:0
}
.hidden{display:none!important}

/* Quiz: deliberately compact. */
#quizView,
#resultView{
  width:100%;
  max-width:820px;
  margin-inline:auto;
  align-content:start;
}
.question{
  height:auto!important;
  min-height:0!important;
  text-align:left;
  align-self:start;
}
.question #qHint{
  min-height:22px;
  text-align:left
}
.question-context{
  margin:8px 0 2px;
  padding:10px 12px;
  border:1px solid var(--glass-border);
  border-radius:12px;
  background:var(--glass-strong);
  color:var(--text);
  font-size:16px;
  line-height:1.35;
  overflow-wrap:anywhere;
  white-space:pre-line
}
.question-context--jp{
  text-align:center;
  font-size:var(--jp-example-size);
  font-weight:750;
  line-height:1.45
}
.question-context--schedule{font-size:18px;font-weight:500;line-height:1.5;text-align:left}
.prompt.prompt--schedule{font-size:clamp(22px,4vw,28px);line-height:1.25;padding:14px 0}
.prompt{
  display:block;
  width:100%;
  min-height:0!important;
  margin:0;
  padding:16px 4px 18px;
  text-align:center;
  font-size:var(--jp-question-size);
  font-weight:700;
  line-height:1.05;
  overflow-wrap:anywhere;
  white-space:pre-line;
  color:var(--text)
}
.prompt--example{font-size:var(--jp-example-size);line-height:1.4}
/* Every quiz route uses text roles, never the display size for kana flashcards. */
.question #qHint{min-height:0;font-size:14px;line-height:1.4;margin-bottom:4px}
.question .question-context{margin:6px 0;padding:8px 10px;font-size:15px;line-height:1.45;font-weight:500;text-align:left}
.question .question-context--jp{font-size:clamp(22px,3vw,26px);line-height:1.5;text-align:center}
.question .prompt{font-size:var(--quiz-text-size);line-height:1.4;padding:8px 0 12px;text-align:left;word-break:normal}
.question .prompt--jp{font-size:var(--quiz-jp-size);line-height:1.45;text-align:center}
.question .audio-feedback:empty{display:none}
#quizTitle{font-size:16px;line-height:1.35}
#quizMeta{font-size:12px;line-height:1.4;margin-top:3px}
#qNow,#qTotal{font-size:13px}
body[data-view="quiz"] .app-header{position:relative;top:auto}
.app:has(#mainView:not(.hidden) .word-crash-course) .app-header{position:relative;top:auto}
.choices{
  display:grid!important;
  width:100%!important;
  min-width:0!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:8px;
  align-items:stretch;
}
.choices.choices-text{
  grid-template-columns:1fr!important
}
.choice{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%!important;
  min-width:0!important;
  min-height:70px;
  margin:0!important;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:13px;
  padding:8px 6px;
  font-weight:750;
  font-size:var(--answer-body-size);
  line-height:1.18;
  text-align:center;
  overflow-wrap:anywhere;
  white-space:normal
}
.choices.choices-text .choice{
  justify-content:flex-start;
  min-height:52px;
  padding:10px 12px;
  text-align:left;
  font-size:var(--answer-compact-size)
}
.choice.choice-jp{font-size:var(--jp-answer-size)}
.choices.choices-text .choice.choice-jp{font-size:var(--jp-answer-size)}
.choice.correct{outline:2px solid var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--panel))}
.choice.incorrect{outline:2px solid var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--panel))}
.feedback{
  min-height:46px;
  margin-top:8px;
  border-radius:12px;
  padding:9px;
  display:block;
  text-align:left;
  font-weight:700
}
.feedback:empty{display:none}
.feedback-message{text-align:center;padding:2px 0 9px}
.feedback-next{width:100%;display:block}
.error{
  background:var(--panel);
  border-radius:12px;
  padding:11px
}

.step-list{display:grid;gap:8px}
.step{border-left:3px solid var(--border);padding:4px 0 4px 11px}
.step-title{font-weight:720}
.vocab-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px
}
.vocab{
  min-width:0;
  background:var(--panel);
  border-radius:12px;
  padding:10px
}
.jp{font-size:var(--jp-body-size);font-weight:720;line-height:1.35;overflow-wrap:anywhere}
.small-section{margin-top:14px}
.small-section-title{margin-bottom:7px;font-size:13px;font-weight:760;color:var(--muted)}
.small-rule-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.small-rule-card,.small-example-card{min-width:0;background:var(--panel);border-radius:12px;padding:10px}
.small-rule-card .formula{margin-top:3px;font-size:11px;color:var(--muted)}
.small-example-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.small-example-card .meaning{margin-top:2px;font-size:12px;color:var(--muted)}
.small-objectives{display:grid;gap:5px;margin-top:7px}
.small-objective{display:flex;gap:7px;align-items:flex-start;font-size:13px}
.small-objective::before{content:"✓";color:var(--good);font-weight:800}
.lesson-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center
}
.notice{
  border-left:4px solid var(--accent);
  padding:10px 12px;
  background:var(--panel);
  border-radius:10px
}

/* Level 4 · echte leerroute */
.lang-lesson-list{display:grid;gap:9px}
.lang-lesson-card{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:15px;padding:13px}
.lang-lesson-card .pattern{margin-top:6px;color:var(--muted);font-size:12px}
.lang-stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:12px}
.lang-step-btn{min-width:0;min-height:48px;border:1px solid var(--border);border-radius:11px;background:var(--panel);padding:6px 3px;color:var(--muted);font-size:10px;font-weight:750}
.lang-step-btn.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--text)}
.lang-step-btn.done::before{content:'✓ ';color:var(--good)}
#langStepBody{margin-top:10px}
.model-sentence{font-size:var(--jp-example-size);font-weight:800;text-align:center;line-height:1.4;margin:10px 0;overflow-wrap:anywhere}
.sentence-analysis{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:10px}
.sentence-part{min-width:68px;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px}
.sentence-part .token{font-size:var(--jp-token-size);font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.sentence-part .role{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-top:3px}
.sentence-part .gloss{font-size:11px;color:var(--muted);margin-top:2px}
.builder-answer{display:flex;flex-wrap:wrap;gap:7px;min-height:62px;align-items:center;padding:9px;border:2px dashed var(--border);border-radius:13px;background:var(--panel);margin-top:10px}
.builder-placeholder{color:var(--muted);font-size:13px}
.builder-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sentence-chip{min-height:46px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:8px 14px;font-size:var(--jp-chip-size);font-weight:750;line-height:1.35;overflow-wrap:anywhere}
.sentence-chip.placed{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:var(--accent)}
.builder-feedback{min-height:38px;margin-top:8px;font-weight:700}
.word-romaji{color:var(--accent);font-size:12px;font-weight:750;margin-top:2px}
.route-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}

/* Storage UI */
.storage-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:26px;
  padding:3px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}
.storage-badge::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--good)
}
.storage-badge.off::before{background:#b65b5b}
.header-actions{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:5px;
  flex-direction:column
}

/* Phone */
@media(max-width:640px){
  .app{
    max-width:none;
    padding:
      max(10px, env(safe-area-inset-top))
      max(9px, env(safe-area-inset-right))
      max(30px, calc(env(safe-area-inset-bottom) + 18px))
      max(9px, env(safe-area-inset-left));
  }
  .stack{gap:9px}
  .card{border-radius:16px;padding:12px}
  .panel{border-radius:12px;padding:10px}
  .h1{font-size:20px}
  .h2{font-size:17px}
  .eyebrow{font-size:10px}

  /* Header no longer pushes the progress button off-screen. */
  .app>section:first-child>.between{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:end!important;
    gap:8px
  }
  .header-actions .storage-badge{display:none}
  .btn{min-height:48px;padding:9px 10px}
  .btn.tiny{min-height:44px}
  .tab{min-height:46px;font-size:12.5px;padding:5px 3px}
  .select{min-height:48px;font-size:16px}

  .level-nav{
    grid-template-columns:34px minmax(0,1fr) 34px;
    gap:5px
  }
  .level-arrow{
    min-height:74px;
    border-radius:12px;
    font-size:24px
  }
  .levels{gap:7px}
  .level{
    flex-basis:118px;
    width:118px;
    min-width:118px;
    min-height:74px;
    border-radius:13px;
    padding:8px
  }
  .level .num{font-size:10px}
  .level .name{font-size:14px}
  .level .sub{font-size:10.5px}

  .grid5{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .grid3{gap:7px}
  .grid2{gap:8px}
  .kana-card{padding:9px 4px}
  :root{--jp-kana-size:42px;--jp-body-size:21px;--jp-chip-size:18px}
  .romaji{font-size:14px}

  .vocab-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .vocab{padding:9px}
  .small-rule-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .small-example-grid{grid-template-columns:1fr;gap:7px}
  .lang-stepper{grid-template-columns:repeat(5,minmax(54px,1fr));overflow-x:auto;padding-bottom:3px}
  .sentence-chip{padding:8px 13px}
  .route-actions{grid-template-columns:1fr}

  #quizView,#resultView{max-width:100%}
  .prompt{padding:13px 2px 15px}
  .choices{

/* === v7 menu structure === */
.app-header{position:relative;z-index:5}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.header-copy{min-width:0}
.nav-back{
  flex:0 0 44px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);
  font-size:24px;line-height:1;font-weight:700
}
.level-menu-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
.level-menu-card{

.level-menu-card .level-no{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.level-menu-card .level-title{font-size:18px;line-height:1.12;font-weight:800}
.level-menu-card .level-desc{font-size:12px;color:var(--muted);line-height:1.3}
.level-menu-card.rank-Copper{border-color:var(--copper)}
.level-menu-card.rank-Silver{border-color:var(--silver)}
.level-menu-card.rank-Gold{border-color:var(--gold)}
.level-menu-card.rank-Platinum{
  border-color:var(--platinum);

}
.level-rank-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.level-overview-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.module-list{display:grid;gap:9px}
.module-card{

.module-card.rank-Copper{border-color:var(--copper)}
.module-card.rank-Silver{border-color:var(--silver)}
.module-card.rank-Gold{border-color:var(--gold)}
.module-card.rank-Platinum{border-color:var(--platinum);background:color-mix(in srgb,var(--platinum) 6%,var(--card))}
.module-title{font-weight:800;font-size:17px}
.module-desc{font-size:12px;color:var(--muted);margin-top:3px}
.module-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}
.selection-grid{

}
.select-tile{

.select-tile input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
.select-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}

.char-select-tile{

@media(min-width:700px){
  .level-menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}

  .lesson-select-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

@media(min-width:1000px){
  .level-menu-grid{grid-template-columns:repeat(4,minmax(0,1fr))}

  .selection-grid{grid-template-columns:repeat(5,minmax(0,1fr))}

}


/* === v11 expanded progress & individual mastery === */
.progress-tabs{

@media(max-width:640px){

/* === v12 immersive anime scenes + liquid glass === */
:root{
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.86);
  --glass-soft:rgba(247,250,252,.58);
  --glass-border:rgba(255,255,255,.72);
  --glass-shadow:0 18px 48px rgba(31,45,48,.16),0 2px 8px rgba(31,45,48,.08);
  --level-glass:rgba(255,255,255,.24);
  --level-glass-strong:rgba(255,255,255,.34);
  --continue-glass:rgba(255,250,243,.74);
}
@media(prefers-color-scheme:dark){
  :root{
    --glass:rgba(19,27,30,.72);
    --glass-strong:rgba(17,24,27,.88);
    --glass-soft:rgba(32,43,47,.62);
    --glass-border:rgba(255,255,255,.17);
    --glass-shadow:0 20px 58px rgba(0,0,0,.38),0 2px 10px rgba(0,0,0,.2);
    --level-glass:rgba(16,24,27,.26);
    --level-glass-strong:rgba(17,25,28,.36);
    --continue-glass:rgba(24,28,27,.78);
  }
}
body{
  position:relative;
  isolation:isolate;
  background:#d9e0da;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:-3vmax;
  pointer-events:none;
}
body::before{
  z-index:-2;
  background-image:url("assets/japan-journey-home.webp");
  background-size:cover;
  background-position:center center;
  filter:saturate(.88) contrast(.94) brightness(.96);
  transform:scale(1.025);
  transition:opacity .45s ease,filter .45s ease;
}
body[data-scene="classroom"]::before{
  background-image:url("assets/anime-classroom.webp");
  background-position:center center;
  filter:saturate(.82) contrast(.9) brightness(.9);
}
body::after{
  z-index:-1;
  background:
    linear-gradient(180deg,rgba(248,251,249,.42),rgba(236,241,237,.28) 48%,rgba(218,227,219,.5)),
    radial-gradient(circle at 50% 12%,rgba(255,255,255,.34),transparent 45%);
}
body[data-scene="classroom"]::after{
  background:linear-gradient(180deg,rgba(244,237,224,.22),rgba(32,42,45,.26));
}
@media(prefers-color-scheme:dark){
  body::after{
    background:linear-gradient(180deg,rgba(7,15,18,.42),rgba(8,15,18,.68));
  }
  body[data-scene="classroom"]::after{
    background:linear-gradient(180deg,rgba(12,16,18,.45),rgba(5,9,11,.72));
  }
}

function level4Weight(question,index){
  const age=index-(question.introducedAt??0);
  return age<=0?5:age<=2?3:1;
}

function weightedLevel4Pick(pool,count,index){
  const remaining=[...pool],picked=[];
  while(remaining.length&&picked.length<count){
    const total=remaining.reduce((sum,q)=>sum+level4Weight(q,index),0);

    picked.push(remaining.splice(chosen,1)[0]);
  }
  return picked;
}

function balancedLevel4Questions(index,count,categories=null,sharedUsed=new Set()){
  let bank=level4QuestionBank(index);
  if(categories)bank=bank.filter(q=>categories.includes(q.category));
  if(!categories)return selectQuestionsWithCoverage(langLessons[index],bank.filter(question=>(question.introducedAt??0)===index),count,`Level 4-mini-check`);
  const current=bank.filter(q=>(q.introducedAt??0)===index),review=bank.filter(q=>(q.introducedAt??0)<index);
  const currentCount=index===0?count:Math.ceil(count*.7),chosen=[],used=sharedUsed;
  const targetKeys=q=>[...(q.targetLemmaIds||[]).map(id=>`lemma:${id}`),...(q.targetConceptId?[q.targetConceptId]:[])];
  const takeBalanced=(pool,wanted)=>{
    const result=[],groups=[...new Set(pool.map(q=>q.category))];
    while(result.length<wanted&&pool.length){
      const category=groups[result.length%groups.length];
      const candidates=pool.filter(q=>q.category===category&&!result.includes(q)&&targetKeys(q).every(key=>!used.has(key)));
      const fallback=pool.filter(q=>!result.includes(q)&&targetKeys(q).every(key=>!used.has(key)));
      const next=weightedLevel4Pick(candidates.length?candidates:fallback,1,index)[0];
      if(!next)break;
      result.push(next);
      targetKeys(next).forEach(key=>used.add(key));

    return result;
  };

  chosen.push(...takeBalanced(review,count-chosen.length));
  chosen.push(...takeBalanced(bank.filter(q=>!chosen.includes(q)),count-chosen.length));
  return shuffle(chosen);
}

  if(ranks['l8-4']?.rank&&ranks['l8-months-2']?.rank)ranks['l8-4'].curriculumRevision=2;
  const previous=saved.version<=7?migration.previousOrder.filter(id=>id!=='l8-months-2'):migration.previousOrder;
  const oldId=previous[s.advancedLesson?.[7]],newId=oldId==='l8-months-2'?'l8-4':oldId;

  s.level8Revision=migration.revision;
}

  recallFeedbackTimer=null;recallFeedbackTimerSession=null;recallFeedbackTimerPosition=-1;recallFeedbackTimerFeedback=null;recallFeedbackTimerToken++;

function scheduleRecallFeedbackAdvance(session){
  if(dictionaryRecallOpen)return;
  if(!session||state.flashcardSession!==session||session.status!=='active'||!recallFeedbackWasCorrect(session))return;
  const feedback=session.feedback,position=session.position;
  if(recallFeedbackTimer!==null&&recallFeedbackTimerSession===session&&recallFeedbackTimerPosition===position&&recallFeedbackTimerFeedback===feedback)return;
  if(recallFeedbackTimer!==null)cancelRecallFeedbackAdvance();

  if(!Number.isFinite(feedback.until)||feedback.until<=now){feedback.until=now+AUDIO_FEEDBACK_MS;scheduleSave()}
  const token=recallFeedbackTimerToken,delay=Math.max(0,feedback.until-now);
  recallFeedbackTimerSession=session;recallFeedbackTimerPosition=position;recallFeedbackTimerFeedback=feedback;
  recallFeedbackTimer=window.setTimeout(()=>{
    if(token!==recallFeedbackTimerToken||recallFeedbackTimerSession!==session||recallFeedbackTimerPosition!==position||recallFeedbackTimerFeedback!==feedback)return;
    recallFeedbackTimer=null;recallFeedbackTimerSession=null;recallFeedbackTimerPosition=-1;recallFeedbackTimerFeedback=null;
    if(state.flashcardSession!==session||session.position!==position||session.feedback!==feedback||session.status!=='active'||state.screen!=='flashcards'||$('flashcardView').classList.contains('hidden')){feedback.until=null;scheduleSave();return}
    flashcardNextCard();
  },delay);
}

function navigateBack(){
  if(activeWordCrashCourse){leaveWordCrashCourse();return}
  if(flightTimer){clearTimeout(flightTimer);flightTimer=null;$('courseFlight').hidden=true;$('courseFlight').classList.remove('is-visible');return}
  if(!$('sceneTransition').hidden){scenes.cancel();return}
  if(!$('sessionView').classList.contains('hidden')){state.screen='levels';scheduleSave();return setMain()}
  if(!$('flashcardView').classList.contains('hidden')||state.screen==='flashcards'){state.screen='levels';scheduleSave();return renderMain()}
  // Een quiz of resultaat is één tijdelijke laag boven de plek waar hij begon.
  // De onderliggende module-/lesstaat blijft intact, dus keer daar direct naar terug.
  if(!$('quizView').classList.contains('hidden')){completeStudySession({status:'afgebroken'});return setMain()}
  if(!$('resultView').classList.contains('hidden'))return setMain();
  if(state.screen==='module'&&state.level>=10){
    if(state.studyTracker.active?.source==='lesson:thematic')completeStudySession({status:'verlaten'});
    state.thematic.step=state.thematic.step==='lesson'?'list':state.thematic.step==='list'?'list':'lesson';
    if(state.thematic.step==='list')state.screen='level';
    scheduleSave();return renderMain();
  }
  // Level 4 heeft een extra hiërarchie: lesstap → lesoverzicht → lessenlijst.
  if(state.screen==='module'&&state.level===3&&state.tabs.lang==='learn'&&state.langView==='lesson'){
    if(state.studyTracker.active?.source==='lesson:lang')completeStudySession({status:'verlaten'});
    if(state.langStep!=='overview'){
      state.langStep='overview';
    }else{
      state.langView='list';
    }
    scheduleSave();
    return renderMain();
  }
  if(state.screen==='module'&&state.level>=5&&state.tabs.advanced==='learn'&&state.advancedView[state.level]==='lesson'){
    if(state.studyTracker.active?.source==='lesson:advanced')completeStudySession({status:'verlaten'});
    if(state.advancedStep[state.level]!=='overview')state.advancedStep[state.level]='overview';
    else state.advancedView[state.level]='list';
    scheduleSave();
    return renderMain();
  }
  const parent=navigation.parentOf(state.screen,{courseId:state.courseId});
  if(parent){state.screen=parent;scheduleSave();return renderMain()}
}

function addDesktopSliderControls(grid,label){

  const update=()=>{

function questionSignature(q){
  if(!q)return'unknown';
  if(q.type==='kana')return`kana|${q.mode}|${q.item?.id||q.item?.front||''}`;
  if(q.type==='scriptReverse')return`scriptReverse|${q.script}|${q.item?.id||q.item?.front||''}`;
  if(q.type==='number')return`number|${q.from}|${q.to}|${q.item?.id||q.item?.valueText||''}`;
  if(q.type==='math')return`math|${q.a}|${q.op}|${q.b}|${q.answer}`;
  return`lesson|${q.kind||''}|${q.prompt||''}|${q.correct||''}`;
}
function mergeErrorBank(source,mistakes){
  if(!state.errorBank[source])state.errorBank[source]=[];
  const bank=state.errorBank[source];
  mistakes.forEach(m=>{
    const q=m.question;
    if(!q)return;
    // A visibly identical answer is never a real learning error.
    if(String(m.chosen).trim()===String(m.correct).trim())return;
    const key=questionSignature(q);
    const found=bank.find(e=>e.key===key);
    if(found){
      found.count=Math.min(20,(found.count||1)+1);
      found.lastAt=Date.now();
      found.question=structuredClone(q);
      found.asked=m.asked;found.correct=m.correct;found.detail=m.detail;
    }else{
      bank.push({key,count:1,lastAt:Date.now(),question:structuredClone(q),asked:m.asked,correct:m.correct,detail:m.detail});
    }
  });
  bank.sort((a,b)=>(b.count-a.count)||(b.lastAt-a.lastAt));
  if(bank.length>80)bank.length=80;
}
function resolveErrorBank(source,q){
  const bank=state.errorBank[source]||[];
  const key=questionSignature(q);
  const i=bank.findIndex(e=>e.key===key);
  if(i<0)return;
  bank[i].count=Math.max(0,(bank[i].count||1)-1);
  bank[i].lastAt=Date.now();
  if(bank[i].count<=0)bank.splice(i,1);
}

function practiceErrorBank(source){
  const bank=(state.errorBank[source]||[]).filter(e=>e.question&&(source!=='small'||e.question.learningGoal));
  if(!bank.length)return;
  const weighted=[];
  bank.forEach(e=>{
    const reps=Math.min(4,Math.max(1,e.count||1));
    for(let i=0;i<reps;i++)weighted.push(structuredClone(e.question));
  });
  const questions=[];
  const target=Math.min(20,Math.max(8,weighted.length));
  let last='';
  for(let i=0;i<target;i++){
    let q=null;
    for(let tries=0;tries<30;tries++){
      const candidate=structuredClone(weighted[Math.floor(Math.random()*weighted.length)]);
      const sig=questionSignature(candidate);
      if(sig!==last||weighted.length===1){q=candidate;last=sig;break}
    }
    if(!q)q=structuredClone(weighted[i%weighted.length]);
    questions.push(q);
  }
  const fallbackPool=source==='hiragana'?allKana('hiragana'):source==='katakana'?allKana('katakana'):source==='mix'?mixItems():source==='dakuten'?allDakItems():source==='numbers'?numberItems([...range(0,99),100,200,300,400,500,600,700,800,900,1000,2000,3000,5000,8000,10000]):[];

}

  if(weakK.length>=3)return'Oefen zwakke Katakana: meerdere tekens zijn recent instabiel.';

  for(const script of ['hiragana','katakana']){
    const row=kanaModules[script].rows.findIndex((_,i)=>!rankState[`${script}-row-${i}`]?.rank);
    if(row>=0)return`${script==='hiragana'?'Hiragana':'Katakana'} · ${kanaModules[script].rows[row].name} volledig oefenen.`;
    for(const exam of ['exam1','exam2','exam3']){
      if(!rankState[`${script}-${exam}`]?.rank)return`${script==='hiragana'?'Hiragana':'Katakana'} · ${exam.replace('exam','Examen ')}.`;

    if(script==='hiragana'){
      for(const id of ['num-basic','num-teens','num-tens','num-under100','num-hundreds','num-thousands']){
        if(!rankState[id]?.rank)return`Cijfers · ${defsCache[id]?.name||id}.`;

  for(const id of ['mix-exam1','mix-exam2']){
    if(!rankState[id]?.rank)return`Kana Mix · ${defsCache[id]?.name||id}.`;
  }
  for(const p of dakutenPatterns){
    for(const script of ['hiragana','katakana']){
      const id=`dak-${script}-${p.id}`;
      if(!rankState[id]?.rank)return`Dakuten · ${script==='hiragana'?'Hiragana':'Katakana'} · ${p.name}.`;
    }
  }
  for(const id of ['dak-examA','dak-examB']){
    if(!rankState[id]?.rank)return`Dakuten · ${defsCache[id]?.name||id}.`;
  }
  const lang=langLessons.find(l=>!rankState[l.id]?.rank);
  if(lang)return`Level 4 · ${lang.title}.`;
  if(!rankState['l4-exam']?.rank)return'Level 4 · level-examen.';
  const small=smallLessons.find(l=>!rankState[l.id]?.rank);
  if(small)return`Level 5 · ${small.title}.`;
  if(!rankState['l5-exam']?.rank)return'Level 5 · level-examen.';
  for(let level=5;level<=9;level++){
    const course=advancedCourses[level],lesson=course.lessons.find(l=>!currentLessonRank(l.id));
    if(lesson)return`Level ${course.number} · ${lesson.title}.`;
    if(!currentLessonRank(`l${course.number}-exam`))return`Level ${course.number} · level-examen.`;
  }
  for(let level=10;level<=11;level++){
    const course=thematicCourses[level],lesson=course.lessons.find(l=>thematicProgress(l)<2);
    if(lesson)return`Level ${course.number} · ${lesson.title}.`;
    if(!rankState[`l${course.number}-exam`]?.rank)return`Level ${course.number} · levelcheck.`;
  }

const RECALL_DIRECTIONS=['jp-nl','nl-jp'],RECALL_SESSION_LIMIT=40,RECALL_NEW_LIMIT=20;
function flashcardDirectionPool(cards,direction){
  if(direction!=='nl-jp')return cards;
  const known=flashcardEligibleCards();
  return cards.filter(card=>!known.some(other=>other.id!==card.id&&flashcardMeaningsOverlap(card,other)));

function getRecallSession(now=Date.now(),options={}){
  const counts={new:0,due:0,upcoming:0,total:0,pool:flashcardEligibleCards().length},due={},fresh={};let nextSuggestedSessionAt=null;
  for(const direction of RECALL_DIRECTIONS){
    due[direction]=[];fresh[direction]=[];
    for(const card of recallCards(direction)){
      const record=flashcardRecord(card.id,direction),item={cardId:card.id,direction,round:0};counts.total++;
      if(!record){counts.new++;fresh[direction].push(item)}
      else if(flashcardDue(record,now)){counts.due++;due[direction].push(item)}
      else{counts.upcoming++;if(Number.isFinite(record.dueAt)&&(nextSuggestedSessionAt===null||record.dueAt<nextSuggestedSessionAt))nextSuggestedSessionAt=record.dueAt}
    }
    // Preserve scheduling; prioritize weak/early due records, never pull future ones forward.
    due[direction].sort((a,b)=>{const ar=flashcardRecord(a.cardId,direction),br=flashcardRecord(b.cardId,direction);return(ar.repetitions||0)-(br.repetitions||0)||(ar.dueAt||0)-(br.dueAt||0)});
  }
  const interleave=buckets=>{const result=[],lists=RECALL_DIRECTIONS.map(direction=>[...buckets[direction]]);while(lists.some(list=>list.length))for(const list of lists)if(list.length){const alternative=list.findIndex(item=>item.cardId!==result.at(-1)?.cardId);result.push(...list.splice(Math.max(0,alternative),1))}return result};
  const limit=Math.max(0,Math.min(RECALL_SESSION_LIMIT,Number.isFinite(options.limit)?Math.floor(options.limit):RECALL_SESSION_LIMIT)),newLimit=Math.max(0,Math.min(RECALL_NEW_LIMIT,Number.isFinite(options.newLimit)?Math.floor(options.newLimit):RECALL_NEW_LIMIT));
  const queue=interleave(due).slice(0,limit);queue.push(...interleave(fresh).slice(0,Math.min(newLimit,limit-queue.length)));

  return{queue,counts,nextSuggestedSessionAt};

function startRecallSession(){

function renderStudyAdjustment(sessionId){
  const s=state.studyTracker.sessions.find(x=>x.id===sessionId),card=$('resultStats')?.parentElement;if(!s||!card)return;const minutes=s.effectiveSeconds>0?Math.max(1,Math.round(s.effectiveSeconds/60)):0;let host=$('studyAdjustment');if(!host){host=document.createElement('details');host.id='studyAdjustment';host.className='panel study-adjust';card.appendChild(host)}host.innerHTML=`<summary>Studietijd aanpassen · ${formatDuration(s.effectiveSeconds,true)}</summary><form id="resultStudyForm" class="study-form" style="margin-top:10px"><div class="study-form-grid"><label>Effectieve minuten<input id="resultStudyMinutes" name="minutes" type="number" min="0" value="${minutes}"></label><label>Moeilijkheid 1–5<input name="difficulty" type="number" min="1" max="5" value="${s.difficulty||''}"></label><label>Begrip 1–5<input name="comprehension" type="number" min="1" max="5" value="${s.comprehension||''}"></label></div><div class="study-toolbar"><button class="btn tiny" type="button" data-minute-delta="-5">−5 min</button><button class="btn tiny" type="button" data-minute-delta="-1">−1 min</button><button class="btn tiny" type="button" data-minute-delta="1">+1 min</button><button class="btn tiny" type="button" data-minute-delta="5">+5 min</button></div><label>Notitie<textarea name="note">${escapeHtml(s.note||'')}</textarea></label><button class="btn primary" type="submit">Aanpassing opslaan</button></form>`;root.querySelectorAll('[data-minute-delta]').forEach(b=>b.onclick=()=>{$('resultStudyMinutes').value=Math.max(0,Number($('resultStudyMinutes').value||0)+Number(b.dataset.minuteDelta))});$('resultStudyForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);s.effectiveSeconds=Math.max(0,Number(fd.get('minutes'))*60);s.difficulty=Number(fd.get('difficulty'))||null;s.comprehension=Number(fd.get('comprehension'))||null;s.note=String(fd.get('note')).trim();saveProgress();renderStudyAdjustment(sessionId)};
}
function renderProgressKnowledge(box){
  if(state.progressKnowledgeTab==='avatar')state.progressKnowledgeTab='levels';
  box.innerHTML=`<div class="progress-tabs"><button class="progress-tab ${state.progressKnowledgeTab==='levels'?'active':''}" data-knowledge="levels">Levels</button><button class="progress-tab ${state.progressKnowledgeTab==='kana'?'active':''}" data-knowledge="kana">Kana</button><button class="progress-tab ${state.progressKnowledgeTab==='vocab'?'active':''}" data-knowledge="vocab">Vocabulaire</button><button class="progress-tab ${state.progressKnowledgeTab==='dictionary'?'active':''}" data-knowledge="dictionary">Dictionary</button><button class="progress-tab ${state.progressKnowledgeTab==='skills'?'active':''}" data-knowledge="skills">Vaardigheden</button></div><div id="knowledgeBody" class="stack"></div>`;
  root.querySelectorAll('[data-knowledge]').forEach(b=>b.onclick=()=>{state.progressKnowledgeTab=b.dataset.knowledge;state.progressDetailId=null;state.progressVocabDetailId=null;scheduleSave();renderProgressKnowledge(box)});const body=$('knowledgeBody');if(state.progressKnowledgeTab==='kana')renderProgressKanaTab(body);else if(state.progressKnowledgeTab==='vocab')renderProgressVocabTab(body);else if(state.progressKnowledgeTab==='dictionary')renderDictionaryTab(body);else if(state.progressKnowledgeTab==='skills')renderProgressSkillsTab(body);else renderProgressLevelTab(body)
}
function renderSession(){
  if(state.progressTab==='profile')state.progressTab='progress';
  show('session');updateHeader();$('sessionView').querySelector('.card .h1').textContent=t('progress.heroTitle');$('sessionView').querySelector('.card .muted').textContent=t('progress.heroIntro');$('sessionBack').textContent=t('common.back');const box=$('sessionContent');box.innerHTML=`<div class="progress-tabs" role="tablist" aria-label="${t('progress.title')}"><button class="progress-tab ${state.progressTab==='progress'?'active':''}" data-progress="progress" role="tab" aria-selected="${state.progressTab==='progress'}">${t('progress.title')}</button><button class="progress-tab ${state.progressTab==='knowledge'?'active':''}" data-progress="knowledge" role="tab" aria-selected="${state.progressTab==='knowledge'}">${t('progress.knowledge')}</button></div><div id="progressBody" class="stack"></div>`;root.querySelectorAll('[data-progress]').forEach(b=>b.onclick=()=>{state.progressTab=b.dataset.progress;state.progressDetailId=null;state.progressVocabDetailId=null;studyEditingId=null;scheduleSave();renderSession()});const body=$('progressBody');if(state.progressTab==='knowledge')renderKnowledgeDashboard(body);else renderProgressDashboard(body)
}

function toggleProgress(){
  if(!$('sessionView').classList.contains('hidden'))navigateBack();
  else renderSession();
}
function goToLearningHome(){
  if(state.studyTracker.active)completeStudySession({status:'verlaten'});
  state.screen='levels';
  scheduleSave();
  renderMain();
}
function goToAppHome(){
  if(state.studyTracker.active)completeStudySession({status:'verlaten'});
  hideAvatarAudioOverlay(false);
  state.currentCourse=null;
  state.screen='app-home';
  routePushRequested=true;
  scheduleSave();
  renderMain();
}
function goToLevels(){
  if(state.studyTracker.active)completeStudySession({status:'verlaten'});
  state.screen='levels';
  scheduleSave();
  renderMain();
}
$('sessionBtn').onclick=toggleProgress;
$('learnNav').onclick=goToLevels;
$('flashcardsNav').onclick=openFlashcards;
$('sessionBack').onclick=navigateBack;
$('navBack').onclick=navigateBack;
$('navHome').onclick=goToAppHome;
$('navOptions').onclick=()=>{state.screen=state.screen==='options'?'app-home':'options';routePushRequested=true;scheduleSave();renderMain()};
$('dictionaryClose').onclick=closeDictionaryModal;
$('dictionaryModal').addEventListener('click',event=>{if(event.target===$('dictionaryModal'))closeDictionaryModal()});
document.addEventListener('click',event=>{
  const close=event.target.closest('[data-audio-close]');if(close){hideAvatarAudioOverlay();return}
  const replay=event.target.closest('[data-audio-replay]');if(replay){if(audioCoachAsset){const completion=audioCoachCompletion,audio=playAvatarAudio(audioCoachAsset.id,audioCoachText,replay,audioCoachPlacement);audioCoachCompletion=audio?completion:null}return}
  const button=event.target.closest('[data-audio-key],[data-audio-text]');if(!button)return;
  event.preventDefault();event.stopPropagation();
  if(button.closest('.knowledge-item')){playKnowledgeTileAudio(button);return}
  let completion=null;
  if(button.closest('#quizView')&&$('qCorrectAudio').dataset.autoNext==='true'){if(quizFeedbackTimer)clearTimeout(quizFeedbackTimer);quizFeedbackTimer=null;const token=quizAnswerToken;completion=()=>{hideAvatarAudioOverlay();if(token===quizAnswerToken)nextQuestion()}}
  const session=state.flashcardSession;if(recallFeedbackWasCorrect(session)&&button.closest('#flashcardView')){cancelRecallFeedbackAdvance();completion=()=>{hideAvatarAudioOverlay();if(state.flashcardSession===session)flashcardNextCard()}}
  const course=activeWordCrashCourse,question=course?.queue[course.index];if(button.closest('.word-crash-course')&&question?.answered&&question.feedback?.correct){cancelWordCrashCourseTimer();completion=()=>{if(activeWordCrashCourse===course&&course.queue[course.index]===question)advanceWordCrashCourse()}};
  const audio=playAvatarAudio(button.dataset.audioKey,button.dataset.audioText,button);audioCoachCompletion=audio?completion:null;
},true);
document.addEventListener('click',event=>{const button=event.target.closest('[data-dictionary-open]');if(!button)return;event.preventDefault();event.stopPropagation();openDictionaryModal(button.dataset.dictionaryOpen,button.dataset.dictionaryLesson,button.dataset.dictionarySentence,button.dataset.dictionaryMeaning)},true);
document.addEventListener('keydown',event=>{const modal=$('dictionaryModal');if(modal.classList.contains('hidden'))return;if(event.key==='Escape'){event.preventDefault();closeDictionaryModal();return}if(event.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
$('quitQuiz').onclick=()=>{completeStudySession({status:'afgebroken'});setMain()};
$('backBtn').onclick=setMain;
$('practiceErrors').onclick=practiceCurrentErrors;
$('retryBtn').onclick=retryCurrent;

root.addEventListener('click',scheduleSave);
root.addEventListener('change',scheduleSave);
window.addEventListener('resize',()=>{detectLayout();updateStorageUI();progressSummaryRefresh?.()},{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(()=>{detectLayout();updateStorageUI()},120),{passive:true});
window.addEventListener('pagehide',()=>{hideAvatarAudioOverlay(false);pauseActiveStudySession()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hideAvatarAudioOverlay(false);pauseActiveStudySession()}else{resumeActiveStudySession();progressSummaryRefresh?.()}});
window.addEventListener('focus',()=>progressSummaryRefresh?.());

detectLayout();
let hadSavedProgress=false;
try{hadSavedProgress=!!localStorage.getItem(STORAGE_KEY)}catch{}
loadProgress();
const initialRoute=location.hash?navigation.parseHash(location.hash,platform.courses):null;
if(initialRoute?.courseId&&initialRoute.courseId!==state.courseId){platform.savePreferences({uiLanguage:state.uiLanguage,courseId:initialRoute.courseId});location.reload();return}
if(initialRoute){state.currentCourse=initialRoute.courseId;state.primaryTab=initialRoute.primaryTab||'learn';state.screen=initialRoute.screen==='session'?'levels':initialRoute.screen;if(Number.isInteger(initialRoute.level))state.level=Math.max(0,Math.min(levels.length-1,initialRoute.level))}
else if(!hadSavedProgress){state.currentCourse=null;state.screen='app-home';state.primaryTab='learn'}
else if(!state.currentCourse&&!state.screen.startsWith('options'))state.screen='app-home';
document.documentElement.lang=state.uiLanguage;
recoverInterruptedStudySession();
if(initialRoute?.screen==='session'||(!initialRoute&&state.currentCourse&&state.primaryTab==='progress'))renderSession();
else renderMain();
window.addEventListener('popstate',()=>{const route=navigation.parseHash(location.hash,platform.courses);if(route)applyBrowserRoute(route)});
window.addEventListener('hashchange',()=>{const route=navigation.parseHash(location.hash,platform.courses);if(route)applyBrowserRoute(route)});
updateStorageUI();
if(typeof MutationObserver!=='undefined'&&document.createTreeWalker){
  const localeObserver=new MutationObserver(()=>i18n.localizeNodes(root,state.uiLanguage));
  localeObserver.observe(root,{subtree:true,childList:true,characterData:true});
  i18n.localizeNodes(root,state.uiLanguage);
}
})();
</script>
